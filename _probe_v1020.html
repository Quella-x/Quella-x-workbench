
<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="index.html?probe=1"></head><body style="padding:20px">
<div class="record-card" style="width:280px"><div class="record-card-header"><span class="record-card-title">标题文字</span></div><div class="record-card-body"><div class="field"><span class="field-label">标签</span><span class="field-value">值</span></div></div></div>
<div class="record-list cal-view"><div class="record-card" style="width:280px"><div class="record-card-header"><span class="record-card-title">标题文字</span></div><div class="record-card-body"><div class="field"><span class="field-label">标签</span><span class="field-value">值</span></div></div></div></div>
<div class="comm-dual"><div class="record-card" style="width:280px"><div class="record-card-header"><span class="record-card-title">标题文字</span></div><div class="record-card-body"><div class="field"><span class="field-label">标签</span><span class="field-value">值</span></div></div></div></div>
<div class="record-card comm-detail-card" style="width:280px"><div class="cdc-header"><span class="cdc-header-main">标题文字</span></div><div class="cdc-body"><div class="cdc-slide"><div class="cdc-row"><span class="cdc-label">标签</span><span class="cdc-value">值</span></div></div></div></div>
<script>
setTimeout(()=>{
 const out=[];
 const styles=['.record-card-header','.record-list.cal-view .record-card-header','.comm-dual .record-card-header','.comm-detail-card .cdc-header','.record-card-body','.record-list .record-card-body','.record-list.cal-view .record-card-body','.comm-dual .record-card-body','.comm-detail-card .cdc-body','.comm-detail-card .cdc-slide'];
 styles.forEach(sel=>{
   const el=document.querySelector(sel); if(!el) return;
   const cs=getComputedStyle(el);
   out.push({sel, paddingTop: cs.paddingTop, paddingBottom: cs.paddingBottom, marginTop: cs.marginTop, marginBottom: cs.marginBottom, height: el.getBoundingClientRect().height.toFixed(2)});
 });
 ['.record-card-title','.record-list.cal-view .record-card-title','.comm-dual .record-card-title','.record-list.oc-rel-list-2col .record-card-title'].forEach(sel=>{
   const el=document.querySelector(sel); if(!el) return;
   const cs=getComputedStyle(el);
   out.push({sel, top: cs.top, lineHeight: cs.lineHeight, position: cs.position});
 });
 console.log('PROBE_BEGIN');
 console.log(JSON.stringify(out,null,2));
 console.log('PROBE_END');
},500);
</script>
</body></html>
