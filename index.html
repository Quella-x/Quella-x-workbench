/* v23: dc-r-sub（柄图：1/2、加价项目、倍率计算 等小节标题）padding-left:12px —— 与 .dc-rr 行文字左边缘对齐（总价左文字 x 一致） */
.dc-r-sub{font-size:11px;font-weight:600;color:var(--c-text-muted);margin-bottom:4px;padding-left:12px}
/* v22: 实时报价小计/优惠——分割线与 dc-r-section 同款虚线（统一视觉） */
.dc-r-section .dc-r-divider{height:0;border-top:1px dashed var(--c-border);margin:8px 0 6px}
/* v26: 实时报价小计/优惠——柄图小计和SET优惠信息改小字号 (11px)，保持 muted 灰色 */
.dc-r-section .dc-r-subtotal{color:var(--c-text-muted);font-weight:600;font-size:11px;padding:3px 0;text-align:left}
.dc-rr{display:flex;justify-content:space-between;font-size:13px;padding:2px 12px;color:var(--c-text)}
/* vCN: 优惠/加急/折扣汇总行——行距与制品行间相同（无额外 margin-top），首条汇总行通过 .promo-first 与制品拉开 */
.dc-rr.promo,.dc-rr.disc{padding:2px 12px}
.dc-rr.promo-first{margin-top:12px}
/* v21: 尾部数字（右侧 ¥金额 / ×倍率）加粗 */
.dc-rr > span:last-child{font-weight:600}
/* v28: 默认 total 上面分割线——与折后小计等 total 行字体同色（var(--c-text)），1px 实线 */
.dc-rr.total{font-weight:600;border-top:1px solid var(--c-text);margin-top:4px;padding-top:4px}
.dc-rr.total > span:last-child{font-size:13px;font-weight:700}
/* v30: 制品序号——两字宽、与制品名间隔 8px（近一点）、字号字重与制品文字统一（继承 13px/normal、色 var(--c-text)） */
.dc-r-no{display:inline-block;min-width:20px;margin-right:8px;color:var(--c-text);font-weight:600;font-style:normal}
/* v31: 含序号的 span（序号+制品名）加粗，与右侧 ¥金额 字重一致 */
.dc-rr > span:has(> .dc-r-no){font-weight:600}
/* v37: 总价——纯色高亮条；改用 display:table + table-cell，table-cell 的 vertical-align:middle 是真正的几何中点对齐（v35 用 inline-block+vertical-align:middle 偏了 9.5px），html2canvas 完全支持 table；左右贴边用 text-align */
.dc-rr.grand-bar{
  background:var(--c-primary);color:#fff;
  border-radius:8px;
  margin:8px 0 0;border-top:none;
  padding:0 12px;
  height:32px;
  display:table;width:100%;
  box-sizing:border-box;
  table-layout:fixed;
  font-size:13px;font-weight:700;
}
.dc-rr.grand-bar > span{
  display:table-cell;
  vertical-align:middle;
  font-size:13px;
  line-height:1;
  font-weight:700;
  white-space:nowrap;
}
.dc-rr.grand-bar > span:first-child{text-align:left}
.dc-rr.grand-bar > span:last-child{text-align:right}
/* DYA轮：右侧金额数字字号改为 15px（左侧文字保持 13px） */
.dc-rr.grand-bar > span:last-child{font-size:15px}
/* v22: 总价 section 与其他 section 一致间距（14px）—— 去掉之前的收紧规则 */
/* v30: 同模明细行（改人/改色...）左对齐制品文字（12 行内边距 + 20 序号宽 + 8 间距 = 40px） */
.dc-rr.sub{font-size:11px;color:var(--c-text-muted);padding:0 12px 1px 40px}
.dc-r-final{background:var(--c-primary);color:#fff;border-radius:8px;padding:12px;text-align:center;margin-top:4px}
.dc-r-final-label{font-size:12px;opacity:.9}
.dc-r-final-val{font-size:24px;font-weight:700;margin-top:2px}
/* DY轮：回退 DV/DW/DX 的修改项目强调面板，恢复 v163 原版——最终总价/需付尾款用普通小计行（.dc-rr.total），不再额外强调 */
.calc-actions{display:flex;gap:8px}
/* v37: 实时报价收据底部署名——字号 11px（与 dc-r-sub/改人 小字同号），色与 .dc-rr 同（var(--c-text)），居中；与上下模块间距 8px 略小 */
.dc-r-footer{text-align:center;font-size:10px;color:var(--c-text);padding:8px 12px 2px;margin-top:6px}

/* ===== v15: Deposit/Balance big blocks (浅蓝/白统一底色) ===== */
.dc-r-deposit-balance{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.dc-r-deposit,.dc-r-balance{
  background:#E0F2FF;color:var(--c-primary-dark);border:1px solid var(--c-primary-light);border-radius:8px;
  padding:10px;text-align:center;
}
.dc-r-db-label{font-size:11px;opacity:.8}
.dc-r-db-val{font-size:18px;font-weight:700;margin-top:2px}

/* DY6轮：修改项目「最终总价 / 需付尾款」双按钮改用与「最终报价」(.dc-r-final) 同款实心蓝块（白字居中），仅并排两列 */
.dc-r-final-balance{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}

/* ===== v15: Export quote as image ===== */
.dc-export-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;padding:8px;border-radius:var(--radius-sm);
  background:var(--c-card);border:1px dashed var(--c-primary);
  color:var(--c-primary);font-size:13px;cursor:pointer;transition:all .2s;
}
.dc-export-btn:hover{background:var(--c-primary-bg)}

/* ===== v15: Custom discount rows ===== */
.dc-custom-disc-row{
  display:flex;align-items:center;gap:6px;padding:4px 0;
}
.dc-custom-disc-row input[type="text"]{flex:1;padding:4px 8px;border:1px solid var(--c-border);border-radius:4px;font-size:12px}
.dc-custom-disc-row input[type="number"]{width:70px;padding:4px 8px;border:1px solid var(--c-border);border-radius:4px;font-size:12px;text-align:center}
.dc-custom-disc-row select{padding:4px 8px;border:1px solid var(--c-border);border-radius:4px;font-size:12px}
.dc-custom-disc-del{width:24px;height:24px;padding:0;font-size:14px;display:flex;align-items:center;justify-content:center}

/* ===== v15: Fan discount (同担/同推随机减价) ===== */
.dc-fan-area{
  border:1px dashed var(--c-primary-light);border-radius:var(--radius-sm);
  padding:8px;margin-top:8px;background:rgba(189,231,255,.08);
}

/* ===== v15: Mind map circular nodes + zoom ===== */
.mindmap-node.circular{
  border-radius:50%!important;width:60px!important;height:60px!important;
  padding:0!important;display:flex!important;flex-direction:column!important;

}
.mindmap-node.circular img{width:44px!important;height:44px!important;border-radius:50%!important}
.mindmap-node.circular .mm-node-alias{font-size:9px;opacity:.7;line-height:1.1;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mindmap-zoom-controls{

  display:flex;flex-direction:column;gap:4px;
}
.mindmap-zoom-btn{
  width:32px;height:32px;border-radius:6px;border:1px solid var(--c-border);
  background:var(--c-card);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.mindmap-zoom-btn:hover{background:var(--c-primary-bg);border-color:var(--c-primary)}
.mindmap-canvas-wrapper{

.record-list.two-col{

}

/* ===== v15/v29-fix2: OC Profile 排序弹窗 ===== */
.sortable-list{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;padding-right:4px}

/* ===== v15/v32: Timeline (时间轨迹) ===== */
/* AH轮修正：时间线选中胶囊加高(垂直padding)、外框内边距取消；全局toolbar间距回16px */
.timeline-filter-bar{
  display:flex;flex-wrap:nowrap;gap:0;align-items:center;justify-content:center;
  width:200px;background:#fff;border:1px solid var(--c-border);border-radius:999px;
  padding:0;margin:8px auto 16px;overflow:hidden;box-sizing:border-box;
}
@media (max-width:768px){
  .timeline-filter-bar{width:100%}
}
/* 时间线页面toolbar与重要性按钮间距回退8px（与toolbar内部按钮gap一致） */
.toolbar:has(+ .timeline-filter-bar){margin-bottom:8px}
.timeline-color-filter{
  flex:0 0 25%;display:inline-flex;align-items:center;justify-content:center;gap:4px;
  padding:6px 0;font-size:13px;font-weight:600;white-space:nowrap;
  cursor:pointer;border:none;transition:all .2s;background:transparent;color:var(--c-text);
  box-sizing:border-box;min-width:0;overflow:hidden;
}
/* 未选中时首尾保持容器半圆；选中时外层不变，内部 label 显示彩色胶囊 */
.timeline-color-filter:first-child{border-radius:999px 0 0 999px}
.timeline-color-filter:last-child{border-radius:0 999px 999px 0}
.timeline-color-filter:hover{opacity:.85}
.timeline-color-filter::before{
  content:'';width:8px;height:8px;border-radius:50%;margin-right:6px;flex-shrink:0;
}
.timeline-color-filter[data-color="红"]::before{background:#e74c3c}
.timeline-color-filter[data-color="橙"]::before{background:#fa8c16}
.timeline-color-filter[data-color="绿"]::before{background:#27ae60}
.timeline-color-filter[data-color="蓝"]::before{background:#3498db}
/* 选中态：外层 dot 隐藏，label 变成彩色胶囊，内部带白点白字；加垂直 padding 让胶囊更高，外框 padding 已取消使胶囊贴近边框 */
.timeline-color-filter.active::before{display:none}
.timeline-color-filter .timeline-color-label{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  padding:5px 4px;box-sizing:border-box;max-width:100%;
}
.timeline-color-filter.active .timeline-color-label{
  padding:5px 22px;border-radius:999px;color:#fff;
}
.timeline-color-filter[data-color="红"].active .timeline-color-label{background:#e74c3c}
.timeline-color-filter[data-color="橙"].active .timeline-color-label{background:#fa8c16}
.timeline-color-filter[data-color="绿"].active .timeline-color-label{background:#27ae60}
.timeline-color-filter[data-color="蓝"].active .timeline-color-label{background:#3498db}
.timeline-color-filter.active .timeline-color-label::before{
  content:'';width:8px;height:8px;border-radius:50%;background:#fff;flex-shrink:0;
}
.timeline-container{
  background:var(--c-card);border-radius:var(--radius);box-shadow:var(--shadow-sm);
  padding:20px;position:relative;
}
.timeline-item{
  display:flex;align-items:stretch;
  border-bottom:1px solid var(--c-border-light);
  position:relative;
}
.timeline-item:last-child{border-bottom:none}
.timeline-time{
  flex-shrink:0;width:100px;text-align:right;
  font-size:13px;color:var(--c-text-muted);font-weight:500;
  padding:16px 28px 16px 0;white-space:nowrap;
}
.timeline-axis{
  flex-shrink:0;width:2px;
  background:var(--c-border-light);position:relative;
}
.timeline-axis::before{
  content:'';position:absolute;left:50%;top:24px;
  transform:translateX(-50%);
  width:10px;height:10px;border-radius:50%;
  background:var(--c-primary);z-index:2;
}
.timeline-item.importance-red .timeline-axis::before{background:#e8857e}
.timeline-item.importance-orange .timeline-axis::before{background:#fa8c16}
.timeline-item.importance-green .timeline-axis::before{background:#7ec678}
.timeline-item.importance-blue .timeline-axis::before{background:#7ab5f5}
.timeline-content{
  flex:1;position:relative;padding:16px 0 16px 28px;
}
.timeline-event-title{font-size:14px;font-weight:600;color:var(--c-text);margin-bottom:4px}
.timeline-event-desc{font-size:12px;color:var(--c-text-light);line-height:1.6;white-space:pre-wrap}
.timeline-event-meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:6px;font-size:11px;color:var(--c-text-muted)}
.timeline-event-source{display:inline-flex;align-items:center;gap:2px}

/* ===== v15: Combobox structure preserved on all devices ===== */

/* ===== Life Module (生活 · 每日打卡/每日记录) v196 — 每日打卡目标卡片+点阵热图；每日记录 v194 ===== */
.spacer{flex:1}

/* Hero */
.life-hero{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--c-primary-bg),#fff);border:1px solid var(--c-border);border-radius:var(--radius);padding:14px 16px;margin:2px 0 14px;box-shadow:var(--shadow-sm)}
.life-hero .lh-ico{font-size:30px}
.life-hero .lh-title{font-size:17px;font-weight:800;color:var(--c-text)}
.life-hero .lh-sub{font-size:12px;color:var(--c-text-light);margin-top:2px}

/* Section title */
.life-section-hd{display:flex;align-items:center;gap:8px;margin:18px 0 10px;padding:0 2px}
.life-section-hd .lsh-ico{font-size:18px}
.life-section-hd .lsh-label{font-size:15px;font-weight:700;color:var(--c-text)}
.life-section-hd .lsh-sub{margin-left:auto;font-size:12px;color:var(--c-text-light)}

/* Summary cards */
.life-summary-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin:12px 0 14px}
.life-summary-card{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:12px 10px;text-align:center;box-shadow:var(--shadow-sm)}
.life-summary-card .lsc-val{font-size:22px;font-weight:800;color:var(--c-primary-dark)}
.life-summary-card .lsc-label{font-size:12px;color:var(--c-text-light);margin-top:2px}

/* Quick check-in block */
.life-quick-checkin{background:var(--c-primary-bg);border:1px solid var(--c-border-light);border-radius:var(--radius);padding:18px 16px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.lqc-hd{display:flex;align-items:center;justify-content:flex-start;gap:10px;margin-bottom:12px}
.lqc-title{font-size:18px;font-weight:700;color:var(--c-text)}
.lqc-count{font-size:11px;font-weight:500;color:var(--c-text-light);background:var(--c-card);padding:2px 8px;border-radius:99px}
.lqc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:10px}
.lqc-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:0;padding:10px 12px;border:1px solid var(--c-border);border-radius:var(--radius-sm);background:var(--c-card);color:var(--c-text);cursor:pointer;transition:.2s}
.lqc-btn:hover{border-color:var(--c-primary);transform:translateY(-1px)}
.lqc-btn.done{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
.lqc-ico{font-size:22px;line-height:1}
.lqc-label{font-size:12px;font-weight:600}
/* 日版块 / 周版块 切换（v221：缩小并置于月份条右侧） */
.life-block-toggle{display:flex;gap:6px;margin:0;align-items:center}
.lbt-btn{
  border:1px solid var(--c-border);background:var(--c-card);color:var(--c-text-light);
  font-size:12px;font-weight:600;padding:5px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;
}
.lbt-btn:hover{border-color:var(--c-primary)}
.lbt-btn.active{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
/* 日版块：习惯卡片整体缩短 */
.life-goal-grid.compact{gap:10px}
.life-goal-grid.compact .life-goal-card{padding:8px 10px;gap:6px}
.life-goal-grid.compact .lgc-name{font-size:15px}
.life-goal-grid.compact .lgc-body{gap:10px}
.life-goal-grid.compact .lgc-heatmap{width:66px}
.life-goal-grid.compact .lgc-desc{font-size:10px}
.life-goal-grid.compact .lgc-monthprog{margin-top:5px}
.life-goal-grid.compact .lgc-foot{margin-top:0}
.life-goal-grid.compact + .life-goal-add{margin-top:10px}

/* Goal cards */
.life-goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.life-goal-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:140px;border:2px dashed var(--c-border);border-radius:var(--radius);background:transparent;cursor:pointer;color:var(--c-text-light);transition:.2s}
.life-goal-add:hover{border-color:var(--c-primary);color:var(--c-primary)}
.lga-plus{font-size:30px;line-height:1}
.lga-txt{font-size:13px}
.life-goal-card{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow-sm);cursor:pointer;transition:box-shadow .2s,transform .2s,border-color .2s;display:flex;flex-direction:column;gap:8px}
.life-goal-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--c-primary-light)}
.lgc-head{display:flex;align-items:center;gap:12px}
.lgc-ico{width:44px;height:44px;border-radius:50%;background:var(--c-primary-bg);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.lgc-title-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lgc-name{font-size:17px;font-weight:700;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1}
.lgc-desc{font-size:11px;font-weight:400;color:var(--c-text-light);flex-shrink:0}
.lgc-arrow{margin-left:auto;font-size:22px;color:var(--c-text-light);font-weight:300}
.lgc-body{display:flex;gap:16px;align-items:center;flex-wrap:nowrap}
.lgc-stats{display:flex;gap:8px;flex:1;min-width:0;align-items:center}
.lgc-stat{flex:1 1 0;background:var(--c-primary-bg);border-radius:var(--radius-sm);padding:10px 6px;text-align:center;min-width:0}
.lgc-num{font-size:20px;font-weight:800;color:var(--c-primary-dark);line-height:1}
.lgc-unit{font-size:11px;color:var(--c-text-light);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgc-heatmap{width:66px;flex-shrink:0}
.lgc-heatmap .life-heatmap{gap:2px}
.lgc-heatmap .hm-day{border-radius:3px}
.lgc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.lgc-status{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.lgc-status.done{color:var(--c-green)}
.lgc-status.todo{color:var(--c-danger)}
.lgc-status .lgc-dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.lgc-foot .btn:disabled{opacity:.55;cursor:not-allowed;background:var(--c-border);color:var(--c-text-light)}

/* Heatmap: calendar-style rounded squares (no weekday header) */
.life-heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.life-heatmap .hm-day{width:100%;aspect-ratio:1;border-radius:6px;background:var(--c-bg);border:none;box-sizing:border-box}
.life-heatmap .hm-day.other-month{background:#fff}
.life-heatmap .hm-day.done{background:var(--c-primary)}
.life-heatmap .hm-day.week{background:var(--c-orange)}

/* Weekly check-in cards use orange accent */
.life-goal-card.week-card .lgc-stat{background:rgba(250,140,22,.12)}
.life-goal-card.week-card .lgc-num{color:var(--c-orange)}
.life-goal-card.week-card .lgc-status.done{color:var(--c-green)}
.life-goal-card.week-card .lgc-mp-num{color:var(--c-orange)}
.life-goal-card.week-card .life-heatmap .hm-day{background:rgba(250,140,22,.07)}
.life-goal-card.week-card .life-heatmap .hm-day.other-month{background:#fff}
.life-goal-card.week-card .life-heatmap .hm-day.week{background:var(--c-orange)}

/* Monthly progress block (1/31 style) — full: label + number + bar */
.lgc-monthprog{display:flex;align-items:center;gap:10px;margin-top:8px}
.lgc-mp-label{font-size:12px;color:var(--c-text-light);white-space:nowrap}
.lgc-mp-num{font-size:18px;font-weight:800;color:var(--c-primary-dark);white-space:nowrap}
.lgc-mp-num.week{color:var(--c-orange)}
.lgc-mp-bar{flex:1;height:8px;background:var(--c-border-light);border-radius:99px;overflow:hidden;min-width:40px}
.lgc-mp-fill{height:100%;background:var(--c-primary);border-radius:99px;transition:width .3s}
.lgc-mp-fill.week{background:var(--c-orange)}

/* Quick check-in matrix */
.life-quick-matrix{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.life-qm-table{width:100%;border-collapse:collapse;font-size:13px}
.life-qm-table th{padding:10px 6px;text-align:center;font-weight:600;color:var(--c-text-light);background:var(--c-primary-bg);border-bottom:1px solid var(--c-border-light)}
.life-qm-table th .wd{font-weight:400;font-size:11px}
.life-qm-table td{padding:10px 6px;text-align:center;border-bottom:1px solid var(--c-border-light);color:var(--c-text-muted)}
.life-qm-table tr:last-child td{border-bottom:none}
.life-qm-table .habit-cell{text-align:left;padding-left:14px;font-weight:600;color:var(--c-text);display:flex;align-items:center;gap:6px}
.life-qm-table .habit-cell .h-ico{font-size:18px}
.life-qm-table .done{color:var(--c-green);font-size:18px;font-weight:800}
.life-qm-table .count{font-size:12px;color:var(--c-text-light)}

/* Modal detail */
.life-modal-body{padding:2px}
.life-modal-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.life-modal-hd .lm-ico{font-size:32px}
.life-modal-hd .lm-name{font-size:16px;font-weight:700;color:var(--c-text)}
.life-modal-hd .lm-desc{font-size:12px;color:var(--c-text-light)}
.life-modal-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.life-modal-actions input[type=date]{padding:7px 9px;font-size:14px;border:1px solid var(--c-border);border-radius:var(--radius-sm);background:#fff}
.life-modal-heatmap{width:232px;margin-bottom:0}

/* Check-in month switcher */
.life-monthbar{position:relative;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.life-monthbar-center{display:flex;align-items:center;justify-content:flex-start;gap:10px;flex:1}
.life-monthbar.week-mode .life-monthbar-center{justify-content:flex-start}
.life-monthbar .btn{border:none;background:transparent;color:var(--c-text-light);font-size:14px;padding:4px 8px;box-shadow:none}
.life-monthbar .btn:hover{color:var(--c-primary);background:transparent}
.life-monthbar .btn:disabled{opacity:.35;cursor:not-allowed;color:var(--c-text-light);background:transparent}
.life-monthbar-txt{font-size:15px;font-weight:700;color:var(--c-text);min-width:96px;text-align:center;cursor:pointer;user-select:none}
.life-monthbar-txt:hover{color:var(--c-primary)}
.life-monthbar .btn:disabled{opacity:.45;cursor:not-allowed}
.life-month-picker{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:61;display:none;width:248px;background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px}
.life-month-picker.show{display:block}
.lmp-yearbar{display:flex;align-items:center;justify-content:space-between;font-weight:700;margin-bottom:10px}
.lmp-months{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lmp-month{padding:9px 0;border:1px solid var(--c-border);border-radius:var(--radius-sm);background:var(--c-bg);font-size:13px;cursor:pointer;color:var(--c-text)}
.lmp-month:hover{border-color:var(--c-primary)}
.lmp-month.sel{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
.life-picker-backdrop{position:fixed;inset:0;z-index:50;background:transparent}
.life-modal-heatmap .life-heatmap{gap:6px}
.life-modal-heatmap .hm-day{cursor:pointer}
.life-modal-heatmap .hm-day:hover{outline:1px solid var(--c-primary);outline-offset:-1px}
.life-modal-heatmap.week .hm-day:hover{outline-color:var(--c-orange)}
.life-modal-heatmap.week .life-heatmap .hm-day{background:rgba(250,140,22,.07)}
.life-modal-heatmap.week .life-heatmap .hm-day.other-month{background:#fff}
.life-modal-heatmap.week .life-heatmap .hm-day.week{background:var(--c-orange)}
.life-modal-heatmap .life-heatmap .hm-day.selected.done{background:var(--c-primary-light)}
.life-modal-heatmap.week .life-heatmap .hm-day.selected.done{background:rgba(250,140,22,.35)}
.life-modal-heatmap .life-heatmap .hm-day.selected:not(.done){outline:1px solid var(--c-primary);outline-offset:-1px}
.life-modal-heatmap.week .life-heatmap .hm-day.selected:not(.done){outline-color:var(--c-orange)}
.life-modal-monthbar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
.life-modal-monthbar .btn{border:none;background:transparent;color:var(--c-text-light);font-size:14px;padding:4px 8px;box-shadow:none}
.life-modal-monthbar .btn:hover{color:var(--c-primary);background:transparent}
.life-modal-monthbar .btn:disabled{opacity:.35;cursor:not-allowed;color:var(--c-text-light);background:transparent}
.lmm-txt{font-size:14px;font-weight:700;color:var(--c-text);min-width:84px;text-align:center}
.life-modal-hmwrap{display:flex;gap:18px;align-items:stretch;margin-bottom:12px;flex-wrap:wrap}
.life-heatmap-hd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:4px}
.life-heatmap-hd span{text-align:center;font-size:11px;color:var(--c-text-muted)}
.life-modal-right{flex:1;min-width:120px;display:flex;flex-direction:column;align-items:stretch;gap:0}
.life-modal-prog{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.lmp-num{font-size:30px;font-weight:800;color:var(--c-primary-dark);line-height:1}
.lmp-num.week{color:var(--c-orange)}
.life-modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.life-modal-undo{background:var(--c-danger);border-color:var(--c-danger);color:#fff}
.life-modal-undo:hover{filter:brightness(.94)}
.life-modal-sel{font-size:12px;color:var(--c-text-light);margin-bottom:10px}
.life-modal-foot{display:flex;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap}
.life-modal-del{color:var(--c-danger)}
.life-modal-hd .lm-name{font-size:16px;font-weight:700;color:var(--c-text);display:flex;align-items:center;gap:8px}
.life-modal-hd .lm-tag{font-size:11px;font-weight:400;color:var(--c-text-light);margin-top:1px}
.life-modal-list{background:var(--c-bg);border:1px solid var(--c-border);border-radius:var(--radius);padding:8px 12px}
.lc-add-form{min-height:210px}
.lc-add-form .combobox-wrapper{width:100%}
.life-modal-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--c-border-light);font-size:13px;color:var(--c-text)}
.life-modal-item:last-child{border-bottom:none}
/* 本周概览（主页面大模块） */
.life-week-module{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow-sm);max-width:420px;margin:0 auto 14px}
.lwm-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;padding-left:0;padding-right:0}
.lwm-title{font-size:18px;font-weight:700;color:var(--c-text)}
.lwm-range{font-size:12px;font-weight:600;color:var(--c-text-light);min-width:120px;text-align:right}
.lwm-grid{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.lwm-row{display:grid;grid-template-columns:minmax(72px,1fr) repeat(7,minmax(0,30px));gap:3px;align-items:center;width:100%}
.lwm-row-hd .lwm-day{text-align:center;font-size:11px;color:var(--c-text-muted);font-weight:600}
.lwm-row-hd .lwm-habit{font-size:11px;color:var(--c-text-muted)}
.lwm-habit{font-size:13px;font-weight:600;color:var(--c-text);display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:0;text-align:left;padding-left:0;padding-right:8px;overflow:hidden}
.lwm-habit-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.lwm-habit .lwm-tag{font-size:9px;font-weight:400;color:var(--c-text-light);white-space:nowrap;flex-shrink:0;margin-left:5px}
.lwm-cell{width:100%;aspect-ratio:1/1;border-radius:3px;background:var(--c-bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;box-sizing:border-box;border:1px solid var(--c-border-light);cursor:pointer}
.lwm-cell.done{background:var(--c-primary);border-color:var(--c-primary)}
.lwm-cell.week{background:rgba(250,140,22,.16);border-color:rgba(250,140,22,.25)}
.lwm-cell.week.done{background:var(--c-orange);border-color:var(--c-orange)}
.lwm-cell.today{outline:1px solid var(--c-primary);outline-offset:-1px}
.lwm-cell.week.today{outline-color:var(--c-orange)}
.lwm-summary{display:flex;gap:10px;flex-wrap:wrap;margin:0 auto 12px;max-width:420px;background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow-sm)}
.lwm-sum-item{flex:1;min-width:100px;display:flex;flex-direction:column;gap:3px}
.lwm-sum-label{font-size:11px;color:var(--c-text-light)}
.lwm-sum-val{font-size:18px;font-weight:800;color:var(--c-text)}

/* Daily record */
.life-record-datebar{display:flex;align-items:center;gap:10px;background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:10px 14px;margin-bottom:4px;flex-wrap:wrap}
.life-record-datebar input[type=date]{padding:7px 9px;font-size:15px;border:1px solid var(--c-border);border-radius:var(--radius-sm);background:#fff}
.life-stat-row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.life-stat{flex:1;min-width:120px;background:var(--c-primary-bg);border-radius:var(--radius);padding:10px 14px;text-align:center}
.life-stat .ls-val{font-size:20px;font-weight:800;color:var(--c-primary-dark)}
.life-stat .ls-label{font-size:12px;color:var(--c-text-light);margin-top:2px}

.life-empty{color:var(--c-text-muted);font-size:13px;padding:12px 2px;text-align:center;background:var(--c-border-light);border-radius:var(--radius-sm);margin-bottom:8px}
.life-rec-item{background:var(--c-bg);border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;transition:border-color .2s}
.life-rec-item:hover{border-color:var(--c-primary)}
.life-rec-main{flex:1;min-width:0}
.life-rec-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--c-text)}
.life-rec-meta .lrf{display:flex;gap:4px}
.life-rec-meta .lrf b{color:var(--c-text-light);font-weight:500}
.life-rec-time{font-size:11px;color:var(--c-text-muted);margin-top:5px}
.life-rec-ops{display:flex;gap:4px;flex-shrink:0}
.life-rec-form{background:var(--c-bg);border:1px dashed var(--c-primary);border-radius:var(--radius);padding:12px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.life-rec-form .lf-field{display:flex;flex-direction:column;gap:3px;min-width:120px}
.life-rec-form .lf-field label{font-size:12px;color:var(--c-text-light)}
.life-rec-form input,.life-rec-form select{padding:7px 9px;font-size:14px;border:1px solid var(--c-border);border-radius:var(--radius-sm);background:#fff}

.life-panel{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-top:14px;overflow:hidden}
.life-panel-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--c-primary-bg);border-bottom:1px solid var(--c-border-light)}
.life-panel-head .lph-ico{font-size:18px}
.life-panel-head .lph-label{font-weight:700;font-size:14px;color:var(--c-text)}
.life-panel-head .lph-count{font-size:11px;color:var(--c-text-light);background:#fff;border:1px solid var(--c-border);border-radius:10px;padding:1px 8px}
.life-panel-body{padding:12px 14px}

/* Sleep chart */
.sleep-chart{margin:2px 0 6px}
.sleep-chart-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.sleep-chart-title{font-size:12px;font-weight:600;color:var(--c-text-light)}
.sleep-chart-avg{font-size:12px;color:var(--c-primary-dark);font-weight:700}
.sleep-chart-bars{position:relative;display:flex;align-items:flex-end;gap:5px;height:120px;padding:0 2px}
.sleep-ref{position:absolute;left:2px;right:2px;border-top:1px dashed var(--c-warning);opacity:.7;z-index:1}
.sleep-bar-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.sleep-bar-val{font-size:9px;color:var(--c-text-light);margin-bottom:2px;white-space:nowrap;line-height:1}
.sleep-bar{width:100%;max-width:20px;background:linear-gradient(180deg,var(--c-primary),var(--c-primary-dark));border-radius:4px 4px 0 0;position:relative;z-index:2}
.sleep-bar.today{background:linear-gradient(180deg,var(--c-orange),#fa8c16)}
.sleep-bar.zero{background:repeating-linear-gradient(180deg,var(--c-border-light) 0 4px,transparent 4px 8px)}
.sleep-chart-x{display:flex;gap:5px;padding:4px 2px 0}
.sleep-x-col{flex:1;min-width:0;text-align:center;font-size:9px;color:var(--c-text-muted);white-space:nowrap;overflow:hidden}
.sleep-x-col.cur{color:var(--c-orange);font-weight:700}
.sleep-chart-foot{margin-top:6px;font-size:11px;color:var(--c-text-muted);display:flex;align-items:center;gap:5px}
.sleep-chart-foot .sch-dot{width:9px;height:9px;border-radius:2px;background:linear-gradient(180deg,var(--c-orange),#fa8c16)}

/* Sleep week table */
.life-week-table{margin-top:12px;background:var(--c-primary-bg);border-radius:var(--radius);padding:8px 10px}
.life-week-table .lwt-title{font-size:12px;font-weight:600;color:var(--c-text-light);margin-bottom:6px}
.life-week-table table{width:100%;border-collapse:collapse;font-size:12px}
.life-week-table th,.life-week-table td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--c-border-light)}
.life-week-table th{color:var(--c-text-light);font-weight:500}

/* ===== Daily Record v247: 1:1 screenshot layout ===== */
.life-record-page{background:var(--c-bg);border-radius:var(--radius);padding:12px;margin:0}
.life-record-datebar{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* Top overview card */
.lr-top-card{display:flex;align-items:center;gap:16px;background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-sm);flex-wrap:wrap}
.sleep-ring-wrap{position:relative;width:104px;height:104px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sleep-ring{width:100%;height:100%;transform:rotate(-90deg)}
.sleep-ring-bg{fill:none;stroke:var(--c-border-light);stroke-width:8}
.sleep-ring-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.sleep-ring-text{position:absolute;font-size:22px;font-weight:800;color:var(--c-text)}
.sleep-ring-status{position:absolute;bottom:-6px;font-size:10px;color:var(--c-text-muted);white-space:nowrap}
.lr-top-stats{flex:1;min-width:130px;display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;align-items:center}
.lr-top-stat{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.lts-label{font-size:11px;color:var(--c-text-light);white-space:nowrap}
.lts-val{font-size:16px;font-weight:700;color:var(--c-text)}
.lr-diet-btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;min-width:124px;flex-shrink:0}
.lr-diet-qbtn{border:1px solid var(--c-border);border-radius:var(--radius-sm);background:var(--c-primary-bg);color:var(--c-text);font-size:14px;font-weight:700;padding:11px 6px;cursor:pointer;transition:.15s}
.lr-diet-qbtn:hover{background:var(--c-primary-light);border-color:var(--c-primary-light);color:var(--c-text)}
.lr-diet-qbtn.filled{background:var(--c-primary);border-color:var(--c-primary);color:#fff}

/* Toggle buttons */
.lr-toggle-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.lr-toggle-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:14px;font-size:16px;font-weight:700;color:var(--c-text);cursor:pointer;transition:.15s;box-shadow:var(--shadow-sm)}
.lr-toggle-btn:hover{border-color:var(--c-primary);color:var(--c-primary)}
.lr-toggle-btn.active{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
.lr-toggle-btn span{font-size:20px}

/* Record cards */
.lr-card{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:14px;overflow:hidden}
.lr-card-head{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--c-primary-bg);border-bottom:1px solid var(--c-border-light)}
.lr-card-title{font-weight:700;font-size:15px;color:var(--c-text);flex:1}
.lr-card-body{padding:12px 14px}
.lr-subtype-box{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--c-border-light);border-radius:var(--radius-sm);background:var(--c-bg);margin-bottom:12px;padding:12px 14px;position:relative}
.lr-subtype-box:last-child{margin-bottom:0}
.lr-subtype-label{flex-shrink:0;width:48px;font-size:20px;font-weight:700;color:var(--c-text);line-height:1.2;padding-top:2px}
.lr-subtype-content{flex:1;min-width:0}
.lr-subtype-add{flex-shrink:0;width:28px;height:28px;border-radius:var(--radius-sm);border:1px solid var(--c-primary);background:var(--c-primary);color:#fff;font-size:18px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:2px}
.lr-subtype-add:hover{background:var(--c-primary-dark)}
.lr-empty-row{color:var(--c-text-muted);font-size:13px;padding:6px 0;cursor:pointer}
.lr-empty-row:hover{color:var(--c-primary)}
.lr-record-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dashed var(--c-border-light)}
.lr-record-row:last-child{border-bottom:none;padding-bottom:0}
.lr-record-row:first-child{padding-top:0}
.lr-record-info{flex:1;min-width:0}
.lr-record-info-2col{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.lr-info-line{display:flex;align-items:baseline;gap:4px;min-width:0}
.lr-info-label{font-size:12px;color:var(--c-text-light);font-weight:500;white-space:nowrap}
.lr-info-val{font-size:13px;color:var(--c-text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr-info-full{grid-column:1 / -1}
.lr-record-ops{display:flex;gap:4px;flex-shrink:0;padding-top:2px}

/* Inline form tweaks */
.lf-field-full{width:100%;min-width:100%}
.life-rec-form .pill-group,.life-rec-form .tag-group{display:flex;flex-wrap:wrap;gap:6px}
.life-rec-form .pill-group .checkbox-item,.life-rec-form .tag-group .checkbox-item{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--c-border);background:var(--c-card);color:var(--c-text);cursor:pointer;user-select:none}
.life-rec-form .pill-group .checkbox-item.selected,.life-rec-form .tag-group .checkbox-item.selected{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
.life-rec-form .pill-group .checkbox-item input,.life-rec-form .tag-group .checkbox-item input{position:absolute;opacity:0}

/* History view */
.lr-history-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lr-history-title{font-size:16px;font-weight:700;color:var(--c-text);flex:1}
.lr-history-stat-card{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.lr-hsc-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.lr-hsc-title{font-size:15px;font-weight:800;color:var(--c-text)}
.lr-hsc-sub{font-size:13px;font-weight:600;color:var(--c-text-light)}
.lr-hsc-chart-body{height:120px;position:relative}
.lr-hsc-chart-body svg{width:100%;height:100%}
.lr-hsc-x{display:flex;justify-content:space-between;padding:4px 2px 0;font-size:10px;color:var(--c-text-muted)}
.lr-hsc-bar-body{display:flex;align-items:flex-end;justify-content:space-around;gap:8px;height:90px}
.lr-hsc-bar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.lr-hsc-bar{width:20px;max-width:80%;background:linear-gradient(180deg,var(--c-primary),var(--c-primary-dark));border-radius:4px 4px 0 0;min-height:4px}
.lr-hsc-bar-num{font-size:13px;font-weight:800;color:var(--c-text)}
.lr-hsc-bar-label{font-size:11px;color:var(--c-text-light);white-space:nowrap}
.lr-history-day-card{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:14px;overflow:hidden}
.lr-history-day-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--c-primary-bg);border-bottom:1px solid var(--c-border-light)}
.lr-history-day-date{font-size:14px;font-weight:700;color:var(--c-text)}
.lr-history-day-wd{font-size:12px;color:var(--c-text-light);font-weight:500}
.lr-history-day-extra{margin-left:auto;font-size:13px;font-weight:700;color:var(--c-primary-dark)}
.lr-history-day-body{padding:12px 14px}
.lr-week-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:10px 12px}

@media (max-width:640px){
  .life-goal-grid{grid-template-columns:1fr}
  .life-goal-card{padding:12px}
  .lgc-body{flex-wrap:nowrap;align-items:center}
  .lgc-heatmap{width:74px;flex-shrink:0}
  .life-qm-table{font-size:12px}
  .life-qm-table th,.life-qm-table td{padding:8px 4px}
  .life-summary-row{grid-template-columns:repeat(2,1fr)}
  .life-hero .lh-ico{font-size:26px}
  .life-record-page{padding:10px;margin:0}
  .life-record-datebar{padding:8px 12px;margin-bottom:12px}
  .lr-top-card{gap:12px;padding:12px}
  .sleep-ring-wrap{width:84px;height:84px}
  .sleep-ring-text{font-size:18px}
  .sleep-ring-status{font-size:9px;bottom:-4px}
  .lr-top-stats{grid-template-columns:1fr 1fr;gap:8px 10px}
  .lr-top-stat{gap:4px}
  .lts-label{font-size:10px}
  .lts-val{font-size:14px}
  .lr-diet-btns{min-width:108px;gap:6px}
  .lr-diet-qbtn{font-size:13px;padding:9px 4px}
  .lr-toggle-btn{font-size:15px;padding:12px}
  .lr-card-head{padding:10px 12px}
  .lr-card-body{padding:10px 12px}
  .lr-subtype-box{gap:10px;padding:10px 12px}
  .lr-subtype-label{width:40px;font-size:18px}
  .lr-subtype-add{width:24px;height:24px;font-size:16px}
  .lr-record-info-2col{grid-template-columns:1fr 1fr;gap:4px 10px}
  .lr-info-label,.lr-info-val{font-size:11px}
  .lr-record-ops{padding-top:0}
  .lr-history-stat-card{padding:12px}
  .lr-hsc-title{font-size:14px}
}
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <span class="logo-icon">🐬</span>
        <span class="logo-text">小筱工作台</span>
      </div>
      <button class="toggle-btn" id="toggleSidebar" title="折叠/展开">☰</button>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main -->
  <div class="main">
    <header class="main-header">
      <button class="mobile-toggle" id="mobileToggle">☰</button>
      <span class="page-title" id="pageTitle">首页</span>
      <span class="sync-badge off" id="syncBadge" onclick="openSyncPanel()" title="云端同步状态 · 点击配置"><span class="sync-dot"></span><span class="sync-ico">☁️</span><span class="sync-txt"> 未同步</span></span>
      <button class="header-settings-btn" onclick="openSettings()" title="设置">⚙️</button>
    </header>
    <div class="main-body" id="mainBody"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">标题</span>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox"><img id="lightboxImg" src=""></div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<!-- Hidden import input -->
<input type="file" id="importFile" accept=".json" style="display:none">

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
