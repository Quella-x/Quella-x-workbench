.home-status-title{font-size:14px;font-weight:700}

/* ===== Commission List-Card Product Checklist ===== */
.comm-products-field{align-items:flex-start;gap:4px}
.comm-product-checklist{display:flex;flex-direction:column;gap:5px;flex:1}
.comm-product-item{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;color:var(--c-text)}
.comm-product-item input{width:16px;height:16px;accent-color:var(--c-green);cursor:pointer}
.comm-product-item.done{text-decoration:line-through;color:var(--c-text-muted);opacity:.7}

/* ===== Home Inspiration Quick-Input (v29) ===== */
.home-insp{
  margin-top:16px;background:var(--c-card-bg,#fff);border:1px solid var(--c-border-light);
  border-radius:var(--radius);padding:14px;
}
.home-insp-title{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;margin-bottom:10px;color:var(--c-text)}
.home-insp-title .hint{font-size:11px;font-weight:400;color:var(--c-text-muted)}
/* v694：首页灵感速记标题图标下挪 2px */
.home-insp-title .lucide-icon{transform:translateY(2px)}
.home-insp-row{display:flex;gap:8px;flex-wrap:wrap}
.home-insp-row .form-input{flex:1;min-width:120px}
.home-insp-row .combobox-wrapper.home-insp-combo{flex:1;min-width:120px}
.home-insp-row .combobox-wrapper.home-insp-combo .form-input{padding-right:30px}
.home-insp textarea.form-input{min-height:56px;resize:vertical;margin-top:8px}
.home-insp-actions{display:flex;justify-content:flex-end;margin-top:10px}

/* ===== Stats Section (separated, two columns) ===== */
.stats-section{
  background:linear-gradient(135deg,var(--c-primary-bg),var(--c-bg));
  border-radius:var(--radius);padding:16px;margin-top:20px;
  border:1px solid var(--c-primary-light);
  display:flex;flex-direction:column;
}
/* v692：stats标题同样包span，gap收紧到4px避免图标和标题离太远（之前6px + space-between 导致两端被推散） */
.stats-section .stats-section-title{
  font-size:13px;font-weight:600;color:var(--c-primary-dark);
  margin-bottom:12px;display:flex;align-items:center;gap:4px;justify-content:space-between;
  flex-shrink:0;
}
.stats-section-title-main{display:flex;align-items:center;gap:4px;min-width:0;flex:1}
.stats-section-title-main .lucide-icon{vertical-align:-1px;transform:translateY(2px)}
.stats-scope-toggle{display:flex;gap:4px;flex-shrink:0;align-items:stretch}
.stats-scope-toggle .btn-xs{padding:5px 14px;font-size:12px;min-height:30px;display:inline-flex;align-items:center}
.stats-section .stats-grid{
  grid-template-columns:repeat(3,1fr);margin:0;gap:10px;
  flex:1;align-items:stretch;
}
.stats-section .stat-card{
  background:rgba(255,255,255,.85);
  border:1px solid var(--c-primary-light);
  padding:12px 14px;
  display:flex;flex-direction:column;justify-content:center;
}
.stats-section .stat-card .stat-value{font-size:18px}

/* ===== Collapsible ===== */
.collapsible-toggle{
  cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:var(--c-primary-bg);border-radius:var(--radius);
  font-size:14px;font-weight:600;color:var(--c-text);
  transition:background .15s;user-select:none;
}
.collapsible-toggle:hover{background:var(--c-primary-light)}
.collapsible-toggle .toggle-arrow{transition:transform .2s;font-size:12px}
.collapsible-toggle.open .toggle-arrow{transform:rotate(180deg)}
.collapsible-content{
  max-height:0;overflow:hidden;transition:max-height .3s ease;
}
.collapsible-content.open{max-height:2000px;overflow:visible}

/* ===== Price List Menu/Receipt Style ===== */
.pricelist-menu{
  background:#fff;border:1px dashed var(--c-border);
  border-radius:4px;padding:20px;
  max-width:420px;margin:16px auto 0;
}
.pricelist-menu-header{
  text-align:center;font-size:22px;font-weight:700;
  letter-spacing:0;padding-bottom:6px;margin-bottom:10px;
  border-bottom:2px dashed var(--c-border);color:var(--c-primary-dark);
}
.pricelist-menu-item{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:5px 16px;border-bottom:1px dotted var(--c-border-light);
  font-size:13px;font-weight:500;cursor:pointer;
}
.pricelist-menu-item:hover{background:var(--c-primary-bg);border-radius:4px}
.pricelist-menu-item:last-child{border-bottom:none}
.pricelist-menu-item .menu-name{flex:1}
.pricelist-menu-item .menu-dots{
  flex:1;border-bottom:1px dotted var(--c-border);
  margin:0 6px;position:relative;top:-3px;
}
.pricelist-menu-item .menu-price{
  font-weight:700;color:var(--c-primary-dark);
}
.pricelist-menu-item .menu-size-sub{
  font-size:10px;font-weight:400;color:var(--c-text-muted);
  margin-left:2px;vertical-align:baseline;
  line-height:1;
}
.pricelist-menu-category{
  font-size:14px;font-weight:700;color:var(--c-text);
  margin:16px 0 6px;padding-bottom:4px;
  border-bottom:1px solid var(--c-border);
  text-transform:uppercase;letter-spacing:1px;
}
/* v29-fix: 价目表独立排序弹窗 */
.pricelist-sort-panel{max-height:60vh;overflow-y:auto;padding-right:4px}
.pricelist-sort-category{font-size:14px;font-weight:700;color:var(--c-text);margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--c-border)}
.pricelist-sort-category:first-child{margin-top:0}
.pricelist-sort-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dotted var(--c-border-light);font-size:13px}
.pricelist-sort-item:last-child{border-bottom:none}
.pricelist-sort-item .sort-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pricelist-sort-item .sort-price{font-weight:700;color:var(--c-primary-dark);margin:0 10px;white-space:nowrap}
.pricelist-sort-item .sort-btns{display:flex;gap:4px}
.pricelist-sort-item .sort-btns button{padding:2px 8px;font-size:12px;min-width:0}

/* ===== Nav Icon Editor ===== */
.nav-icon-edit-list{display:flex;flex-direction:column;gap:0;margin-top:8px;background:var(--c-primary-bg);border-radius:var(--radius-sm);padding:6px 10px}
.nav-icon-edit-item{
  display:flex;align-items:center;gap:0;padding:10px 0;
  background:transparent;border-radius:0;border-bottom:1px solid rgba(0,0,0,.06);
}
.nav-icon-edit-item:last-child{border-bottom:none}
.nav-icon-edit-item .icon-preview{
  font-size:18px;width:32px;text-align:center;flex-shrink:0;
}
.nav-icon-edit-name{
  font-size:12px;color:var(--c-text);min-width:72px;flex-shrink:0;
}
.nav-icon-edit-item input{
  padding:6px 10px;border:1px solid var(--c-border);
  border-radius:4px;font-size:13px;
}
.nav-icon-input{flex:1;min-width:0;margin-left:-12px}
.nav-label-input{flex:1;min-width:0;margin-left:4px}

/* ===== Mindmap Arrow Labels ===== */
.mindmap-arrow-label{
  font-size:10px;font-weight:600;
  paint-order:stroke;stroke:#fff;stroke-width:3px;
  paint-order:stroke fill;
}

/* ===== Relation Person Buttons (collapsible) ===== */
/* v692：人物关系模块到上面按钮的距离太远——减小 margin-bottom（用户要求） */
.relation-person-row{
  display:flex;align-items:flex-start;gap:8px;flex-wrap:nowrap;margin-bottom:4px;
}
.relation-person-grid{
  display:flex;flex-wrap:wrap;gap:8px;flex:1;min-width:0;margin-bottom:0;
}
/* 折叠态：只显示一排，超出隐藏，由右侧「展开/收起」按钮控制 */
.relation-person-grid.collapsed{max-height:42px;overflow:hidden}
/* 中间角色按钮在剩余空间内均匀分布，全部(头) 与 展开(尾) 固定 */
.relation-person-grid.distribute{justify-content:space-evenly}
.relation-person-row>.relation-person-btn,.relation-person-row>.relation-toggle-btn{flex:0 0 auto}
/* v693：OC 模块「全部」按钮前的菜单图标上移 2px（覆盖 oc-commission/oc-stories/oc-timeline/oc-relations） */
.relation-person-btn .lucide-icon{transform:translateY(-2px)}
.relation-person-btn{
  transform:translateX(-1px);
  padding:8px 16px;border-radius:20px;
  background:var(--c-primary-bg);color:var(--c-primary-dark);
  font-size:13px;font-weight:600;cursor:pointer;
  border:1px solid var(--c-primary-light);transition:all .2s;
  display:flex;align-items:center;gap:6px;
}
.relation-person-btn:hover{background:var(--c-primary);color:#fff}
.relation-person-btn.active{background:var(--c-primary);color:#fff}
.relation-toggle-btn{
  flex:0 0 auto;margin:0;padding:8px 14px;border-radius:20px;line-height:1.4;white-space:nowrap;
  background:var(--c-card);color:var(--c-primary);border:1px solid var(--c-primary-light);
  font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;
}
.relation-toggle-btn:hover{background:var(--c-primary-bg)}
.relation-expand{
  margin-top:8px;padding:12px;background:var(--c-primary-bg);
  border-radius:var(--radius-sm);font-size:12px;
  display:none;
}
.relation-expand.show{display:block}

/* ===== Commission Calc Display ===== */
.commission-calc-display{
  background:var(--c-primary-bg);border-radius:var(--radius-sm);
  padding:12px;margin:8px 0;font-size:13px;
}
.commission-calc-row{
  display:flex;justify-content:space-between;padding:3px 0;
}
.commission-calc-row.highlight{
  font-weight:700;font-size:14px;color:var(--c-primary-dark);
  border-top:1px solid var(--c-primary-light);margin-top:6px;padding-top:8px;
}

/* ===== Stats Divider (solid line between records and stats) ===== */
.stats-divider{
  height:2px;background:var(--c-primary-dark);margin:24px 0 16px;
  border-radius:1px;opacity:.3;
}

/* ===== FAB Add Button (v13) ===== */
.fab-add{
  position:fixed;right:32px;bottom:32px;z-index:900;
  width:52px;height:52px;border-radius:50%;border:none;
  background:var(--c-primary);color:#fff;font-size:28px;cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.2);transition:all .2s;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.fab-add:hover{transform:scale(1.1);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.fab-add:active{transform:scale(.95)}

/* ===== Pagination (v13) ===== */
.pagination{
  display:flex;align-items:center;justify-content:center;gap:12px;
  padding:16px 0 4px;
}
.pagination .page-info{font-size:13px;color:var(--c-text-muted)}
.pagination .page-link{background:transparent;border:none;color:var(--c-text-light);font-size:13px;padding:4px 8px;cursor:pointer;transition:all .2s}
.pagination .page-link:hover{color:var(--c-primary)}
.pagination .page-link:disabled{color:var(--c-text-muted);opacity:.5;cursor:not-allowed}
/* v643：接稿排期列表视图翻页在双栏网格(.comm-dual)内被挤进左列，改为跨整行居中 */
.comm-dual .pagination{grid-column:1 / -1}

/* ===== Custom Combobox Dropdown ===== */
.combobox-wrapper{position:relative;display:inline-block;width:100%}
.combobox-input{padding-right:30px!important}
.combobox-toggle{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;border:none;background:transparent;
  color:var(--c-text-muted);font-size:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.combobox-dropdown{
  display:none;position:absolute;top:100%;left:0;right:0;
  max-height:200px;overflow-y:auto;background:#fff;
  border:1px solid var(--c-border);border-radius:var(--radius-sm);
  box-shadow:var(--shadow);z-index:9999;min-width:140px;margin-top:2px;
}
.combobox-dropdown.show{display:block}
.combobox-option{
  padding:8px 12px;font-size:13px;cursor:pointer;transition:background .15s;
  color:var(--c-text);
}
.combobox-option:hover{background:var(--c-primary-bg);color:var(--c-primary)}
/* CC轮：加价项目/制品等 combobox 下拉框内容自适应宽度，保证长名称全部显示不被截断 */
.dc-extra-row .combobox-dropdown,.dc-product-row .combobox-dropdown,.dc-mod-row .combobox-dropdown{white-space:nowrap;left:0;right:auto;min-width:100%;width:max-content;max-width:90vw}
.combobox-option.selected{background:var(--c-primary-bg);color:var(--c-primary);font-weight:600}

/* ===== Lucide 图标统一规范（v686） =====
   尺寸由 lucide(name,size) 参数控制；此处只统一显示方式与基线对齐。
   颜色统一继承 currentColor（随父级文字色变化），线宽统一 2（见图标表）。 */
/* v689：图标尺寸改为 1em（跟随所在文字字号），配合 vertical-align:middle 完美居中。
   此前 18px 图标配 14-16px 文字导致图标顶/底远超文字，垂直居中后仍偏上/偏下。
   1em 让图标 = 文字字号，再加 middle 与文字 x-height 中心对齐，彻底消除偏位。 */
.lucide-icon{display:inline-block;vertical-align:middle;flex-shrink:0;width:1em;height:1em}
.icon-preview .lucide-icon{width:18px;height:18px;vertical-align:middle}
.empty-icon .lucide-icon{width:32px;height:32px;vertical-align:middle;opacity:.55}
.search-icon .lucide-icon{width:16px;height:16px;vertical-align:middle}
.btn-icon .lucide-icon{width:16px;height:16px;vertical-align:middle}

/* ===== Design Quote Calculator ===== */
.calc-page{max-width:1200px;margin:0 auto}
.calc-page-grid{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.calc-input-col{display:flex;flex-direction:column;gap:12px;container-type:inline-size}
.calc-card{background:var(--c-card-bg,#fff);border:1px solid var(--c-border-light,#e8e8e8);border-radius:10px;padding:14px}
.calc-card-title{font-size:14px;font-weight:600;color:var(--c-text);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.price-calc-title{margin-bottom:16px}
.calc-card-hint{font-size:11px;font-weight:400;color:var(--c-text-muted)}
.calc-mode-tabs{display:flex;gap:0;margin-bottom:8px}
.calc-mode-tab{flex:1;padding:8px 12px;border:1px solid var(--c-border);background:var(--c-bg);font-size:13px;cursor:pointer;color:var(--c-text);transition:all .15s}
.calc-mode-tab:first-child{border-radius:6px 0 0 6px}
.calc-mode-tab:last-child{border-radius:0 6px 6px 0;border-left:none}
.calc-mode-tab.active{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
.calc-import-select{width:100%;margin-top:4px}
/* AT轮: 报价计算制品列表——列序：序号、制品、柄图标识、价格、数量、加急、同模、删除 */
.dc-product-header{display:none}
.dc-product-header > span{box-sizing:border-box;padding-left:8px}
.dc-product-header > span:last-child{padding-left:0}
.dc-product-header > span:nth-child(1){grid-area:seq}
.dc-product-header > span:nth-child(2){grid-area:name}
.dc-product-header > span:nth-child(3){grid-area:pattern}
.dc-product-header > span:nth-child(4){grid-area:price}
.dc-product-header > span:nth-child(5){grid-area:qty}
.dc-product-header > span:nth-child(6){grid-area:urgent}
.dc-product-header > span:nth-child(7){grid-area:same}
.dc-product-header > span:nth-child(8){grid-area:del}
.dc-product-row{display:grid;grid-template-columns:28px minmax(110px,1fr) 70px 60px 48px 32px;gap:4px;margin-bottom:6px;align-items:center;padding:0;grid-template-areas:"seq name pattern price qty del" ". row2 row2 row2 row2 ."}
.dc-product-row .form-input{padding:6px 8px;font-size:13px;box-sizing:border-box;text-align:left}
.dc-product-row .dc-prod-name-wrapper,.dc-extra-row .combobox-wrapper{min-width:0;width:100%}
.dc-product-row .dc-prod-seq{min-width:24px}
.dc-product-row .dc-prod-name-wrapper{grid-area:name}
.dc-product-row .dc-prod-pattern{grid-area:pattern}
.dc-product-row .dc-prod-price{grid-area:price}
.dc-product-row .dc-prod-qty{grid-area:qty}
.dc-product-row .dc-prod-row2{grid-area:row2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dc-product-row .dc-prod-urgent{justify-content:flex-start;font-size:13px;gap:2px}
.dc-product-row .dc-prod-same{justify-content:flex-start;font-size:13px;gap:2px}
.dc-product-row .dc-prod-del{margin-left:auto}
.dc-prod-check{display:flex;align-items:center;justify-content:flex-start;gap:3px;font-size:13px;cursor:pointer;color:var(--c-text-muted);white-space:nowrap}
.dc-prod-check input{accent-color:var(--c-primary);width:14px;height:14px;flex-shrink:0}
/* BC轮：同模下拉移出 label，作为独立 combobox，与制品名称下拉同款 */
.dc-prod-model-type-wrapper{position:relative;display:inline-block;width:160px;min-width:160px;flex:0 0 auto}
.dc-prod-model-type{width:100%;padding-right:30px!important}
.dc-prod-del{width:32px;height:28px;padding:0;font-size:14px;display:flex;align-items:center;justify-content:center;justify-self:end;background:transparent;color:var(--c-text-light);border:none;border-radius:6px;transition:all .15s}
.dc-prod-del:hover{background:#fff0f0;color:var(--c-danger)}
/* v-NEW: 制品序号（只读，纯数字，无框） */
.dc-prod-seq{display:flex;align-items:center;justify-content:flex-start;font-size:13px;font-weight:600;color:var(--c-text);min-width:24px;height:32px;box-sizing:border-box;padding-left:10px}
.dc-product-row .dc-prod-seq.setgroup{color:var(--c-primary)}
/* v-NEW: 加价项目绑定制品字段（combobox，置于名称前面，样式同灵感记录制品下拉，保留【下拉选择器】结构）
   CF轮：废弃原生 select，改用 combobox（input+toggle+dropdown），选项读取制品列表序号+制品，含「无（不绑定）」 */
.dc-extra-bind-wrapper{width:100%}
/* v-NEW: 实时报价中绑定的加价项目树形缩进展示（无蓝条，颜色与制品相同）
   AS轮：tree 后文字与制品明细文字左对齐
   制品文字起点 = .dc-rr padding-left(12) + .dc-r-no(20) + margin(8) = 40px
   所以 .dc-r-tree(22) + margin(2) = 24px，bound 左内边距 = 40 - 24 = 16px
*/
.dc-rr.bound{margin-left:0;padding:2px 12px 2px 40px;color:var(--c-text);font-size:13px}
.dc-r-tree{display:inline-block;width:28px;margin-right:0;color:var(--c-text);font-style:normal;font-weight:600;text-align:left}
/* v22: 加价项目——与制品列表同款对齐规则：header 与 row padding/gap 一致 */
.dc-extra-header{display:grid;grid-template-columns:160px minmax(80px,1fr) 65px 70px 40px;gap:6px;font-size:12px;color:var(--c-text-muted);margin-bottom:6px;padding:0;text-align:left;font-weight:500}
.dc-extra-header > span{box-sizing:border-box;padding-left:8px}
.dc-extra-header > span:last-child{padding-left:0}
.dc-extra-row{display:grid;grid-template-columns:160px minmax(80px,1fr) 65px 70px 40px;gap:6px;margin-bottom:6px;align-items:center;padding:0}
.dc-extra-row .form-input{padding:7px 8px;font-size:13px;box-sizing:border-box;text-align:left}
.dc-extra-del{width:32px;height:28px;padding:0;font-size:14px;display:flex;align-items:center;justify-content:center;justify-self:end;background:transparent;color:var(--c-text-light);border:none;border-radius:6px;transition:all .15s}
.dc-extra-del:hover{background:#fff0f0;color:var(--c-danger)}
/* AS轮：修改加价 */
.dc-mod-header{display:grid;grid-template-columns:minmax(100px,1.2fr) 55px 65px minmax(80px,1fr) 32px;gap:6px;font-size:12px;color:var(--c-text-muted);margin-bottom:6px;padding:0;text-align:left;font-weight:500}
.dc-mod-header > span{box-sizing:border-box;padding-left:8px}
.dc-mod-header > span:last-child{padding-left:0}
.dc-mod-row{display:grid;grid-template-columns:minmax(100px,1.2fr) 55px 65px minmax(80px,1fr) 32px;gap:6px;margin-bottom:6px;align-items:center;padding:0}
.dc-mod-row .form-input{padding:7px 8px;font-size:13px;box-sizing:border-box;text-align:left}
.dc-mod-del{width:32px;height:28px;padding:0;font-size:14px;display:flex;align-items:center;justify-content:center;justify-self:end;background:transparent;color:var(--c-text-light);border:none;border-radius:6px;transition:all .15s}
.dc-mod-del:hover{background:#fff0f0;color:var(--c-danger)}
.calc-rate-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--c-border-light)}
.calc-rate-row:last-child{border-bottom:none}
.calc-rate-label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--c-text);cursor:pointer}
.calc-rate-label input[type="radio"],.calc-rate-label input[type="checkbox"]{accent-color:var(--c-primary)}
/* Bo轮：整单加急开关改成与稿件用途倍率radio同款圆形（checkbox视觉radio化）；Br轮：抽出通用 .calc-circle 让稿件用途倍率/同模阶梯价/优惠体系的 radio 也统一到 20px/2px边框/8px蓝点 */
.dc-urgent-toggle,.calc-circle{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1px solid var(--c-border);border-radius:50%;outline:none;cursor:pointer;position:relative;flex-shrink:0;background:#fff;box-sizing:border-box;margin:0}
.dc-urgent-toggle:checked,.calc-circle:checked{border-color:var(--c-primary);background:#fff}
.dc-urgent-toggle:checked::after,.calc-circle:checked::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:var(--c-primary)}
.dc-urgent-toggle:disabled,.calc-circle:disabled{opacity:1;cursor:not-allowed;background:#e8e8ea;border-color:#ccc}
.dc-urgent-toggle:disabled::after,.calc-circle:disabled::after{background:#bbb;border-color:#ccc}
.calc-rate-label-disabled{color:var(--c-text-muted);cursor:not-allowed}
/* Bu轮：制品行勾选同模但本行与全局都未选类型时的校验提示 */
.dc-prod-model-warn{color:#e34d59;font-size:11px;margin-left:6px;align-self:center;white-space:nowrap}
.calc-rate-input{width:70px;padding:4px 8px;border:1px solid var(--c-border);border-radius:6px;font-size:13px;text-align:center}
/* Bn轮：稿件用途倍率/加急/全局同模阶梯价倍率/优惠体系/同担同推优惠的数字框取消上下步进箭头，仅可输入修改 */
.calc-rate-input[type=number]::-webkit-outer-spin-button,
.calc-rate-input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.calc-rate-input[type=number]{-moz-appearance:textfield;appearance:textfield}
.calc-rate-fixed{font-size:13px;color:var(--c-text-muted);width:70px;text-align:center}
.calc-sub-area{padding:4px 0 4px 20px;transition:opacity .2s}
.calc-sub-area.disabled{opacity:.4;pointer-events:none}
.calc-receipt-col{position:sticky;top:0;display:flex;flex-direction:column;gap:12px}
.calc-receipt{background:linear-gradient(135deg,var(--c-primary-bg),#f8fbff);border:1px solid var(--c-primary-light);border-radius:10px;padding:16px}
.dc-r-title{font-size:18px;font-weight:700;color:var(--c-text);margin-bottom:12px;text-align:center}
/* v26: 实时报价分隔线归一
   - .dc-r-section 不再画 bB（避免与下方 .dc-rr.total bT 紧贴形成双线）
   - 仅用 padding-bottom + margin-bottom 作为下间距
   - 倍率后价格改回普通 dc-rr.total（与制品合计/基础总金额 同款，仅一条 bT 分隔线）
*/
.dc-r-section{margin-bottom:8px;padding-bottom:6px}
.dc-r-section + .dc-r-section{margin-top:4px}
/* v23: dc-r-sub（柄图：1/2、加价项目、倍率计算 等小节标题）padding-left:12px —— 与 .dc-rr 行文字左边缘对齐（总价左文字 x 一致） */
.dc-r-sub{font-size:11px;font-weight:600;color:var(--c-text-muted);margin-bottom:4px;padding-left:12px}
/* v22: 实时报价小计/优惠——分割线与 dc-r-section 同款虚线（统一视觉） */
.dc-r-section .dc-r-divider{height:0;border-top:1px dashed var(--c-border);margin:8px 0 6px}
/* v26: 实时报价小计/优惠——柄图小计和SET优惠信息改小字号 (11px)，保持 muted 灰色 */
.dc-r-section .dc-r-subtotal{color:var(--c-text-muted);font-weight:600;font-size:11px;padding:3px 0;text-align:left}
.dc-rr{display:flex;justify-content:space-between;font-size:13px;padding:2px 12px;color:var(--c-text)}
/* vCN: 优惠/加急/折扣汇总行——行距与制品行间相同（无额外 margin-top），首条汇总行通过 .promo-first 与制品拉开 */
.dc-rr.promo,.dc-rr.disc{padding:2px 12px}
.dc-rr.promo-first{margin-top:12px}
/* v21: 尾部数字（右侧 ¥金额 / ×倍率）加粗 */
.dc-rr > span:last-child{font-weight:600}
/* v28: 默认 total 上面分割线——与折后小计等 total 行字体同色（var(--c-text)），1px 实线 */
.dc-rr.total{font-weight:600;border-top:1px solid var(--c-text);margin-top:4px;padding-top:4px}
.dc-rr.total > span:last-child{font-size:13px;font-weight:700}
/* v30: 制品序号——两字宽、与制品名间隔 8px（近一点）、字号字重与制品文字统一（继承 13px/normal、色 var(--c-text)） */
.dc-r-no{display:inline-block;min-width:20px;margin-right:8px;color:var(--c-text);font-weight:600;font-style:normal}
/* v31: 含序号的 span（序号+制品名）加粗，与右侧 ¥金额 字重一致 */
.dc-rr > span:has(> .dc-r-no){font-weight:600}
/* v37: 总价——纯色高亮条；改用 display:table + table-cell，table-cell 的 vertical-align:middle 是真正的几何中点对齐（v35 用 inline-block+vertical-align:middle 偏了 9.5px），html2canvas 完全支持 table；左右贴边用 text-align */
.dc-rr.grand-bar{
  background:var(--c-primary);color:#fff;
  border-radius:8px;
  margin:8px 0 0;border-top:none;
  padding:0 12px;
  height:32px;
  display:table;width:100%;
  box-sizing:border-box;
  table-layout:fixed;
  font-size:13px;font-weight:700;
}
.dc-rr.grand-bar > span{
  display:table-cell;
  vertical-align:middle;
  font-size:13px;
  line-height:1;
  font-weight:700;
  white-space:nowrap;
}
.dc-rr.grand-bar > span:first-child{text-align:left}
.dc-rr.grand-bar > span:last-child{text-align:right}
/* DYA轮：右侧金额数字字号改为 15px（左侧文字保持 13px） */
.dc-rr.grand-bar > span:last-child{font-size:14px}
/* v22: 总价 section 与其他 section 一致间距（14px）—— 去掉之前的收紧规则 */
/* v30: 同模明细行（改人/改色...）左对齐制品文字（12 行内边距 + 20 序号宽 + 8 间距 = 40px） */
.dc-rr.sub{font-size:11px;color:var(--c-text-muted);padding:0 12px 1px 40px}
.dc-r-final{background:var(--c-primary);color:#fff;border-radius:8px;padding:12px;text-align:center;margin-top:4px}
.dc-r-final-label{font-size:12px;opacity:.9}
.dc-r-final-val{font-size:24px;font-weight:700;margin-top:2px}
/* DY轮：回退 DV/DW/DX 的修改项目强调面板，恢复 v163 原版——最终总价/需付尾款用普通小计行（.dc-rr.total），不再额外强调 */
.calc-actions{display:flex;gap:8px}
/* v37: 实时报价收据底部署名——字号 11px（与 dc-r-sub/改人 小字同号），色与 .dc-rr 同（var(--c-text)），居中；与上下模块间距 8px 略小 */
.dc-r-footer{text-align:center;font-size:10px;color:var(--c-text);padding:8px 12px 2px;margin-top:6px}

/* ===== v15: Deposit/Balance big blocks (浅蓝/白统一底色) ===== */
.dc-r-deposit-balance{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.dc-r-deposit,.dc-r-balance{
  background:#E0F2FF;color:var(--c-primary-dark);border:1px solid var(--c-primary-light);border-radius:8px;
  padding:10px;text-align:center;
}
.dc-r-db-label{font-size:11px;opacity:.8}
.dc-r-db-val{font-size:18px;font-weight:700;margin-top:2px}

/* DY6轮：修改项目「最终总价 / 需付尾款」双按钮改用与「最终报价」(.dc-r-final) 同款实心蓝块（白字居中），仅并排两列 */
.dc-r-final-balance{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}

/* ===== v15: Export quote as image ===== */
.dc-export-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;padding:8px;border-radius:var(--radius-sm);
  background:var(--c-card);border:1px dashed var(--c-primary);
  color:var(--c-primary);font-size:13px;cursor:pointer;transition:all .2s;
}
.dc-export-btn:hover{background:var(--c-primary-bg)}

/* ===== v15: Custom discount rows ===== */
.dc-custom-disc-row{
  display:flex;align-items:center;gap:6px;padding:4px 0;
}
.dc-custom-disc-row input[type="text"]{flex:1;padding:4px 8px;border:1px solid var(--c-border);border-radius:4px;font-size:12px}
.dc-custom-disc-row input[type="number"]{width:70px;padding:4px 8px;border:1px solid var(--c-border);border-radius:4px;font-size:12px;text-align:center}
.dc-custom-disc-row select{padding:4px 8px;border:1px solid var(--c-border);border-radius:4px;font-size:12px}
.dc-custom-disc-del{width:24px;height:24px;padding:0;font-size:14px;display:flex;align-items:center;justify-content:center}

/* ===== v15: Fan discount (同担/同推随机减价) ===== */
.dc-fan-area{
  border:1px dashed var(--c-primary-light);border-radius:var(--radius-sm);
  padding:8px;margin-top:8px;background:rgba(189,231,255,.08);
}

/* ===== v15: Mind map circular nodes + zoom ===== */
.mindmap-node.circular{
  border-radius:50%!important;width:60px!important;height:60px!important;
  padding:0!important;display:flex!important;flex-direction:column!important;
  align-items:center!important;justify-content:center!important;
  text-align:center;overflow:hidden;
}
.mindmap-node.circular img{width:44px!important;height:44px!important;border-radius:50%!important}
.mindmap-node.circular .mm-node-alias{font-size:9px;opacity:.7;line-height:1.1;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mindmap-zoom-controls{
  position:absolute;top:8px;right:8px;z-index:10;
  display:flex;flex-direction:column;gap:4px;
}
.mindmap-zoom-btn{
  width:32px;height:32px;border-radius:6px;border:1px solid var(--c-border);
  background:var(--c-card);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.mindmap-zoom-btn:hover{background:var(--c-primary-bg);border-color:var(--c-primary)}
.mindmap-canvas-wrapper{
  width:100%;overflow:hidden;position:relative;
  touch-action:none;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.mindmap-hint{
  position:absolute;top:8px;left:8px;z-index:10;
  background:rgba(255,255,255,.85);backdrop-filter:blur(6px);
  font-size:11px;color:var(--c-text-muted);padding:4px 8px;border-radius:6px;
  pointer-events:none;
}

/* ===== v15: Two-column record list (mobile keeps two columns) ===== */
.record-list.two-col{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}

/* ===== v15/v29-fix2: OC Profile 排序弹窗 ===== */
.sortable-list{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;padding-right:4px}
.sortable-item{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:10px 12px;background:var(--c-card-bg,#fff);
  border:1px solid var(--c-border-light);border-radius:10px;
}
.sortable-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.sortable-actions{display:flex;gap:6px}
.sortable-actions .btn-ghost{width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center}
.sortable-actions .btn-ghost:disabled{opacity:.35;cursor:not-allowed}

/* ===== v15/v32: Timeline (时间轨迹) ===== */
/* AH轮修正：时间线选中胶囊加高(垂直padding)、外框内边距取消；全局toolbar间距回16px */
.timeline-filter-bar{
  display:flex;flex-wrap:nowrap;gap:0;align-items:center;justify-content:center;
  width:fit-content;min-width:auto;max-width:100%;background:#fff;border:1px solid var(--c-border);border-radius:999px;
  padding:0;margin:8px auto 16px;overflow:hidden;box-sizing:border-box;
}
@media (max-width:768px){
  .timeline-filter-bar{width:100%}
}
/* 时间线页面toolbar与重要性按钮间距回退8px（与toolbar内部按钮gap一致） */
.toolbar:has(+ .timeline-filter-bar){margin-bottom:8px}
.timeline-color-filter{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:4px;
  width:84px;padding:6px 0;font-size:13px;font-weight:600;white-space:nowrap;
  cursor:pointer;border:none;transition:all .2s;background:transparent;color:var(--c-text);
  box-sizing:border-box;min-width:0;overflow:hidden;
}
@media (max-width:768px){
  .timeline-color-filter{flex:1 1 0;width:auto;padding:6px 0}
}
/* 未选中时首尾保持容器半圆；选中时外层不变，内部 label 显示彩色胶囊 */
.timeline-color-filter:first-child{border-radius:999px 0 0 999px}
.timeline-color-filter:last-child{border-radius:0 999px 999px 0}
.timeline-color-filter:hover{opacity:.85}
.timeline-color-filter::before{
  content:'';width:8px;height:8px;border-radius:50%;flex-shrink:0;
}
.timeline-color-filter[data-color="红"]::before{background:#e74c3c}
.timeline-color-filter[data-color="橙"]::before{background:#fa8c16}
.timeline-color-filter[data-color="绿"]::before{background:#27ae60}
.timeline-color-filter[data-color="蓝"]::before{background:#3498db}
/* 选中态：外层 dot 隐藏，label 变成彩色胶囊，内部带白点白字；加垂直 padding 让胶囊更高，外框 padding 已取消使胶囊贴近边框 */
.timeline-color-filter.active::before{display:none}
.timeline-color-filter .timeline-color-label{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  padding:5px 4px;box-sizing:border-box;max-width:100%;
}
.timeline-color-filter.active .timeline-color-label{
  padding:5px 14px;border-radius:999px;color:#fff;
}
.timeline-color-filter[data-color="红"].active .timeline-color-label{background:#e74c3c}
.timeline-color-filter[data-color="橙"].active .timeline-color-label{background:#fa8c16}
.timeline-color-filter[data-color="绿"].active .timeline-color-label{background:#27ae60}
.timeline-color-filter[data-color="蓝"].active .timeline-color-label{background:#3498db}
.timeline-color-filter.active .timeline-color-label::before{
  content:'';width:8px;height:8px;border-radius:50%;background:#fff;flex-shrink:0;
}
.timeline-container{
  background:var(--c-card);border-radius:var(--radius);box-shadow:var(--shadow-sm);
  padding:20px;position:relative;
}
.timeline-item{
  display:flex;align-items:stretch;
  border-bottom:1px solid var(--c-border-light);
  position:relative;
}
.timeline-item:last-child{border-bottom:none}
.timeline-time{
  flex-shrink:0;width:100px;text-align:right;
  font-size:13px;color:var(--c-text-muted);font-weight:500;
  padding:16px 28px 16px 0;white-space:nowrap;
}
.timeline-axis{
  flex-shrink:0;width:2px;
  background:var(--c-border-light);position:relative;
}
.timeline-axis::before{
  content:'';position:absolute;left:50%;top:24px;
  transform:translateX(-50%);
  width:10px;height:10px;border-radius:50%;
  background:var(--c-primary);z-index:2;
}
.timeline-item.importance-red .timeline-axis::before{background:#e8857e}
.timeline-item.importance-orange .timeline-axis::before{background:#fa8c16}
.timeline-item.importance-green .timeline-axis::before{background:#7ec678}
.timeline-item.importance-blue .timeline-axis::before{background:#7ab5f5}
.timeline-content{
  flex:1;position:relative;padding:16px 0 16px 28px;
}
.timeline-event-title{font-size:14px;font-weight:600;color:var(--c-text);margin-bottom:4px}
.timeline-event-desc{font-size:12px;color:var(--c-text-light);line-height:1.6;white-space:pre-wrap}
.timeline-event-meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:6px;font-size:11px;color:var(--c-text-muted)}
.timeline-event-source{display:inline-flex;align-items:center;gap:2px}

/* ===== v15: Mobile sidebar fixes ===== */
@media(max-width:768px){
  .sidebar{
    height:100vh;height:100dvh;
    background:linear-gradient(180deg,var(--c-sidebar-start) 0%,var(--c-sidebar-end) 100%);
  }
  .sidebar-nav{flex:1}
  .nav-item{font-size:14px!important;padding:12px 16px!important}
  .nav-item .nav-icon{font-size:18px!important}
  .nav-group-title{font-size:12px!important}
  .sidebar-logo .logo-text{font-size:16px!important}
}

/* ===== v15: Combobox structure preserved on all devices ===== */

/* ===== Life Module (生活 · 每日打卡/每日记录) v196 — 每日打卡目标卡片+点阵热图；每日记录 v194 ===== */
.spacer{flex:1}

/* Hero */
.life-hero{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--c-primary-bg),#fff);border:1px solid var(--c-border);border-radius:var(--radius);padding:14px 16px;margin:2px 0 14px;box-shadow:var(--shadow-sm)}
.life-hero .lh-ico{font-size:30px}
.life-hero .lh-title{font-size:16px;font-weight:800;color:var(--c-text)}
.life-hero .lh-sub{font-size:12px;color:var(--c-text-light);margin-top:2px}

/* Section title */
.life-section-hd{display:flex;align-items:center;gap:8px;margin:18px 0 10px;padding:0 2px}
.life-section-hd .lsh-ico{font-size:18px}
.life-section-hd .lsh-label{font-size:14px;font-weight:700;color:var(--c-text)}
.life-section-hd .lsh-sub{margin-left:auto;font-size:12px;color:var(--c-text-light)}

/* Summary cards */
.life-summary-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin:12px 0 14px}
.life-summary-card{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:12px 10px;text-align:center;box-shadow:var(--shadow-sm)}
.life-summary-card .lsc-val{font-size:22px;font-weight:800;color:var(--c-primary-dark)}
.life-summary-card .lsc-label{font-size:12px;color:var(--c-text-light);margin-top:2px}

/* Quick check-in block */
.life-quick-checkin{background:#fff;border:1px solid var(--c-border-light);border-radius:var(--radius);padding:18px 12px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.lqc-hd{display:flex;align-items:center;justify-content:flex-start;gap:10px;margin-bottom:12px}
.lqc-title{font-size:18px;font-weight:700;color:var(--c-text)}
.lqc-count{font-size:11px;font-weight:500;color:var(--c-text-light);background:var(--c-card);padding:2px 8px;border-radius:99px}
.lqc-count.lqc-c0{color:#e53935;background:#fdecea}
.lqc-count.lqc-cpart{color:#f57c00;background:#fff3e0}
.lqc-count.lqc-cfull{color:#2e7d32;background:#e8f5e9}
.lqc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:10px}
.lqc-btn{box-sizing:border-box;display:flex;align-items:center;justify-content:center;min-width:0;padding:13px 6px;border:1px solid var(--c-border);border-radius:var(--radius-sm);background:var(--c-bg);color:var(--c-text);font-size:18px;font-weight:550;cursor:pointer;transition:.15s}
.lqc-btn:hover{background:#e0f2ff;border-color:var(--c-primary-light);color:var(--c-text)}
.lqc-btn.done{background:rgba(24,144,255,.24);border-color:rgba(24,144,255,.24);color:var(--c-text)}
.lqc-weekly:not(.done){background:rgba(250,140,22,.07);border-color:#ffe0b2;color:var(--c-text)}
.lqc-weekly:not(.done):hover{background:rgba(250,140,22,.12);border-color:rgba(250,140,22,.12);color:var(--c-text)}
.lqc-btn.lqc-weekly.done{background:rgba(250,140,22,.24);border-color:rgba(250,140,22,.24);color:var(--c-text)}
.lqc-ico{font-size:22px;line-height:1}
.lqc-label{font-size:18px;font-weight:550;white-space:nowrap}
/* 日版块 / 周版块 切换（v221：缩小并置于月份条右侧） */
.life-block-toggle{display:flex;gap:6px;margin:0 0 0 auto;align-items:center}
.lbt-btn{
  border:1px solid var(--c-border);background:var(--c-card);color:var(--c-text-light);
  font-size:12px;font-weight:600;padding:5px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;
}
.lbt-btn:hover{border-color:var(--c-primary)}
.lbt-btn.active{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
/* 日版块：习惯卡片整体缩短 */
.life-goal-grid.compact{gap:10px}
.life-goal-grid.compact .life-goal-card{padding:10px 12px;gap:6px}
.life-goal-grid.compact .lgc-name{font-size:14px}
.life-goal-grid.compact .lgc-body{gap:10px}
.life-goal-grid.compact .lgc-heatmap{width:66px}
.life-goal-grid.compact .lgc-desc{font-size:11px}
.life-goal-grid.compact .lgc-monthprog{margin-top:3px}
.life-goal-grid.compact .lgc-foot{margin-top:0}
.life-goal-grid.compact .lgc-status{font-size:12px}
.life-goal-grid.compact .lgc-status .lgc-dot{width:6px;height:6px}
.life-goal-grid.compact + .life-goal-add{margin-top:10px}

/* Goal cards */
.life-goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.life-goal-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:140px;border:2px dashed var(--c-border);border-radius:var(--radius);background:transparent;cursor:pointer;color:var(--c-text-light);transition:.2s}
.life-goal-add:hover{border-color:var(--c-primary);color:var(--c-primary)}
.lga-plus{font-size:30px;line-height:1}
.lga-txt{font-size:13px}
.life-goal-card{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s,border-color .2s;display:flex;flex-direction:column;gap:8px}
.life-goal-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--c-primary-light)}
.lgc-head{display:flex;align-items:center;gap:12px}
.lgc-ico{width:44px;height:44px;border-radius:50%;background:var(--c-primary-bg);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.lgc-title-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.lgc-name{font-size:16px;font-weight:700;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1}
.lgc-desc{display:inline;font-size:11px;color:var(--c-text-muted);font-weight:400;margin-left:0;flex-shrink:0}
.lgc-arrow{display:none}
.lgc-body{display:flex;gap:16px;align-items:center;flex-wrap:nowrap}
.lgc-stats{display:flex;gap:8px;flex:1;min-width:0;align-items:center;margin:0}
.lgc-stats.lgc-stats-4{gap:6px}
.lgc-stat{flex:1 1 0;background:var(--c-primary-bg);border-radius:var(--radius-sm);padding:8px 4px;text-align:center;min-width:0}
.lgc-stats-4 .lgc-stat{padding:8px 2px;min-height:54px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.lgc-stats-4 .lgc-num{min-height:1em}
.lgc-rate-stat{cursor:pointer;transition:all .15s}
.lgc-rate-stat:hover{background:var(--c-primary-light)}
.lgc-rate-stat.rated .lgc-num{color:var(--c-orange)}
.lgc-num{font-size:16px;font-weight:800;color:var(--c-primary-dark);line-height:1}
.lgc-stats-4 .lgc-num{font-size:16px}
.lgc-unit{font-size:10px;color:var(--c-text-light);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgc-heatmap{width:66px;flex-shrink:0}
.lgc-heatmap .life-heatmap{gap:2px}
.lgc-heatmap .hm-day{border-radius:3px}
.lgc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.lgc-status{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.lgc-status.done{color:var(--c-green)}
.lgc-status.todo{color:var(--c-danger)}
.lgc-status .lgc-dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.lgc-foot .btn:disabled{opacity:.55;cursor:not-allowed;background:var(--c-border);color:var(--c-text-light)}

/* Heatmap: calendar-style rounded squares (no weekday header) */
.life-heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.life-heatmap .hm-day{width:100%;aspect-ratio:1;border-radius:6px;background:var(--c-bg);border:none;box-sizing:border-box}
.life-heatmap .hm-day.other-month{background:#fff}
.life-heatmap .hm-day.done{background:var(--c-primary)}
.life-heatmap .hm-day.week{background:var(--c-orange)}

/* Weekly check-in cards use orange accent */
.life-goal-card.week-card .lgc-stat{background:rgba(250,140,22,.12)}
.life-goal-card.week-card .lgc-num{color:var(--c-orange)}
.life-goal-card.week-card .lgc-status.done{color:var(--c-green)}
.life-goal-card.week-card .lgc-mp-num{color:var(--c-orange)}
.life-goal-card.week-card .life-heatmap .hm-day{background:rgba(250,140,22,.07)}
.life-goal-card.week-card .life-heatmap .hm-day.other-month{background:#fff}
.life-goal-card.week-card .life-heatmap .hm-day.week{background:var(--c-orange)}

/* Monthly progress block (1/31 style) — full: label + number + bar */
.lgc-monthprog{display:flex;align-items:center;gap:10px;margin-top:8px}
.lgc-mp-label{font-size:12px;color:var(--c-text-light);white-space:nowrap}
.lgc-mp-num{font-size:18px;font-weight:800;color:var(--c-primary-dark);white-space:nowrap}
.lgc-mp-num.week{color:var(--c-orange)}
.lgc-mp-bar{flex:1;height:8px;background:var(--c-border-light);border-radius:99px;overflow:hidden;min-width:40px}
.lgc-mp-fill{height:100%;background:var(--c-primary);border-radius:99px;transition:width .3s}
.lgc-mp-fill.week{background:var(--c-orange)}

/* Quick check-in matrix */
.life-quick-matrix{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.life-qm-table{width:100%;border-collapse:collapse;font-size:13px}
.life-qm-table th{padding:10px 6px;text-align:center;font-weight:600;color:var(--c-text-light);background:var(--c-primary-bg);border-bottom:1px solid var(--c-border-light)}
.life-qm-table th .wd{font-weight:400;font-size:11px}
.life-qm-table td{padding:10px 6px;text-align:center;border-bottom:1px solid var(--c-border-light);color:var(--c-text-muted)}
.life-qm-table tr:last-child td{border-bottom:none}
.life-qm-table .habit-cell{text-align:left;padding-left:14px;font-weight:600;color:var(--c-text);display:flex;align-items:center;gap:6px}
.life-qm-table .habit-cell .h-ico{font-size:18px}
.life-qm-table .done{color:var(--c-green);font-size:18px;font-weight:800}
.life-qm-table .count{font-size:12px;color:var(--c-text-light)}

/* Modal detail */
.life-modal-body{padding:2px}
.life-modal-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.life-modal-hd .lm-ico{font-size:32px}
.life-modal-hd .lm-name{font-size:16px;font-weight:700;color:var(--c-text)}
.life-modal-hd .lm-desc{font-size:12px;color:var(--c-text-light)}
.life-modal-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.life-modal-actions input[type=date]{padding:7px 9px;font-size:14px;border:1px solid var(--c-border);border-radius:var(--radius-sm);background:#fff}
.life-modal-heatmap{width:232px;margin-bottom:0}

/* Check-in month switcher */
.life-monthbar{position:relative;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.life-monthbar-center{display:flex;align-items:center;justify-content:flex-start;gap:10px;flex:1}
.life-monthbar.week-mode .life-monthbar-center{justify-content:flex-start;gap:2px}
.life-monthbar.year-mode .life-monthbar-center{justify-content:flex-start;gap:2px}
.life-monthbar .btn{border:none;background:transparent;color:var(--c-text-light);font-size:14px;padding:4px 8px;box-shadow:none}
.life-monthbar .btn:hover{color:var(--c-primary);background:transparent}
.life-monthbar .btn:disabled{opacity:.35;cursor:not-allowed;color:var(--c-text-light);background:transparent}
.life-monthbar-txt{font-size:14px;font-weight:700;color:var(--c-text);min-width:96px;text-align:center;cursor:pointer;user-select:none}
.life-monthbar-txt:hover{color:var(--c-primary)}
.life-monthbar .btn:disabled{opacity:.45;cursor:not-allowed}
.life-month-picker{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:61;display:none;width:248px;background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px}
.life-month-picker.show{display:block}
.lmp-yearbar{display:flex;align-items:center;justify-content:space-between;font-weight:700;margin-bottom:10px}
.lmp-months{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lmp-month{padding:9px 0;border:1px solid var(--c-border);border-radius:var(--radius-sm);background:var(--c-bg);font-size:13px;cursor:pointer;color:var(--c-text)}
.lmp-month:hover{border-color:var(--c-primary)}
.lmp-month.sel{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
.life-year-picker{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:61;display:none;width:268px;background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px}
.life-year-picker.show{display:block}
.lyp-years{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lyp-year{padding:9px 0;border:1px solid var(--c-border);border-radius:var(--radius-sm);background:var(--c-bg);font-size:13px;cursor:pointer;color:var(--c-text)}
.lyp-year:hover{border-color:var(--c-primary)}
.lyp-year.sel{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
.lmp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.lmp-day{padding:0;border:1px solid var(--c-border);border-radius:var(--radius-sm);background:var(--c-bg);font-size:12px;cursor:pointer;color:var(--c-text);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.lmp-day:hover{border-color:var(--c-primary)}
.lmp-day.sel{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
/* 周视图：选择某年某月后展开的「周段」快捷选择 */
.lmp-weeks-title{font-size:12px;color:var(--c-text-muted);text-align:center;margin:8px 0 6px}
.lmp-weeks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 8px 6px}
.lmp-week{padding:4px 8px;border:1px solid var(--c-border);border-radius:var(--radius-sm);background:var(--c-bg);font-size:11px;cursor:pointer;color:var(--c-text)}
.lmp-week:hover{border-color:var(--c-primary)}
.lmp-week.sel{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
/* 每日记录：睡眠/饮食卡片内的紧凑日期条 */
.lr-card-datebar{display:flex;justify-content:center;margin:8px 0 4px}
.lr-date-nav-inner{display:flex;align-items:center;justify-content:center;gap:8px}
.lr-date-nav-inner .cd-month-label{font-size:14px;font-weight:700;color:var(--c-text);min-width:88px;text-align:center;cursor:pointer;user-select:none}
.lr-date-nav-inner .cd-month-label:hover{color:var(--c-primary)}
.lr-date-nav-inner .cd-month-btn{border:none;background:transparent;color:var(--c-text-light);font-size:13px;padding:4px 8px;box-shadow:none;cursor:pointer}
.lr-date-nav-inner .cd-month-btn:hover{color:var(--c-primary);background:transparent}
.life-picker-backdrop{position:fixed;inset:0;z-index:50;background:transparent}
#lifePickerBackdrop{display:none}
#lifePickerBackdrop.show{display:block}
.life-year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.life-year-card{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm)}
.life-year-grid .life-goal-card{padding-top:10px}
.lyc-name{font-size:14px;font-weight:700;color:var(--c-text);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.life-year-grid .lgc-name{font-size:14px}
.lyc-tag{font-size:11px;font-weight:500;color:var(--c-text-light);background:transparent;border:none;padding:1px 4px}
.life-year-card.lyc-week{border-left:3px solid var(--c-orange)}
.life-year-card.lyc-week .lyc-num{color:var(--c-orange)}
.life-year-card.lyc-day{border-left:3px solid var(--c-primary)}
.life-year-card.lyc-day .lyc-num{color:var(--c-primary)}
.lyc-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lyc-stat{background:var(--c-bg);border-radius:var(--radius-sm);padding:10px;text-align:center}
.lyc-num{font-size:22px;font-weight:800;color:var(--c-primary);line-height:1.1}
.lyc-unit{font-size:12px;color:var(--c-text-light);margin-top:3px}
/* 年视图评分面板（评分作为第 4 个统计按钮模块，点击后展开评分选择） */
.year-rate-panel{display:none;flex-wrap:wrap;gap:6px;padding:8px 0 2px;align-items:center;justify-content:center}
.year-rate-panel .yr-rate-btn{flex:1 1 0;min-width:36px;max-width:60px;height:34px;border:1px solid var(--c-border);background:var(--c-bg);border-radius:var(--radius-sm);padding:0;font-size:14px;font-weight:700;color:var(--c-text);cursor:pointer;transition:all .15s}
.year-rate-panel .yr-rate-btn:hover{border-color:var(--c-orange);background:var(--c-primary-bg)}
.year-rate-panel .yr-rate-btn.sel{background:var(--c-orange);border-color:var(--c-orange);color:#fff}
.year-rate-panel .yr-rate-btn.yr-rate-clear{flex:0 0 auto;min-width:48px;font-size:12px;font-weight:500;color:var(--c-text-light);background:transparent}
.life-modal-heatmap .life-heatmap{gap:6px}
.life-modal-heatmap .hm-day{cursor:pointer}
.life-modal-heatmap .hm-day:hover{outline:1px solid var(--c-primary);outline-offset:-1px}
.life-modal-heatmap.week .hm-day:hover{outline-color:var(--c-orange)}
.life-modal-heatmap.week .life-heatmap .hm-day{background:rgba(250,140,22,.07)}
.life-modal-heatmap.week .life-heatmap .hm-day.other-month{background:#fff}
.life-modal-heatmap.week .life-heatmap .hm-day.week{background:var(--c-orange)}
.life-modal-heatmap .life-heatmap .hm-day.selected.done{background:var(--c-primary-light)}
.life-modal-heatmap.week .life-heatmap .hm-day.selected.done{background:rgba(250,140,22,.35)}
.life-modal-heatmap .life-heatmap .hm-day.selected:not(.done){outline:1px solid var(--c-primary);outline-offset:-1px}
.life-modal-heatmap.week .life-heatmap .hm-day.selected:not(.done){outline-color:var(--c-orange)}
.life-modal-monthbar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
.life-modal-monthbar .btn{border:none;background:transparent;color:var(--c-text-light);font-size:14px;padding:4px 8px;box-shadow:none}
.life-modal-monthbar .btn:hover{color:var(--c-primary);background:transparent}
.life-modal-monthbar .btn:disabled{opacity:.35;cursor:not-allowed;color:var(--c-text-light);background:transparent}
.lmm-txt{font-size:14px;font-weight:700;color:var(--c-text);min-width:84px;text-align:center}
.life-modal-hmwrap{display:flex;gap:18px;align-items:stretch;margin-bottom:12px;flex-wrap:wrap}
.life-heatmap-hd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:4px}
.life-heatmap-hd span{text-align:center;font-size:11px;color:var(--c-text-muted)}
.life-modal-right{flex:1;min-width:120px;display:flex;flex-direction:column;align-items:stretch;gap:0}
.life-modal-prog{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.lmp-num{font-size:30px;font-weight:800;color:var(--c-primary-dark);line-height:1}
.lmp-num.week{color:var(--c-orange)}
.life-modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.life-modal-undo{background:var(--c-danger);border-color:var(--c-danger);color:#fff}
.life-modal-undo:hover{filter:brightness(.94)}
.life-modal-sel{font-size:12px;color:var(--c-text-light);margin-bottom:10px}
.life-modal-foot{display:flex;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap}
.life-modal-del{color:var(--c-danger)}
.life-modal-hd .lm-name{font-size:16px;font-weight:700;color:var(--c-text);display:flex;align-items:center;gap:8px}
.life-modal-hd .lm-tag{font-size:11px;font-weight:400;color:var(--c-text-light);margin-top:1px}
.life-modal-list{background:var(--c-bg);border:1px solid var(--c-border);border-radius:var(--radius);padding:8px 12px;min-height:40px}
.lc-add-form{min-height:210px}
.lc-add-form .combobox-wrapper{width:100%}
.life-modal-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--c-border-light);font-size:13px;color:var(--c-text)}
.life-modal-item:last-child{border-bottom:none}
/* ===== v627 每日打卡配色局部调整（仅覆盖点名位置，全局 token 不动） ===== */
/* ① 顶部「今日打卡」日卡未完成按钮底 */
.life-quick-checkin .lqc-btn:not(.lqc-weekly):not(.done){background:#eef7ff;border-color:#d6e6fb}
.life-quick-checkin .lqc-btn:not(.lqc-weekly):not(.done):hover{background:#e0f2ff;border-color:var(--c-primary-light)}
/* ② 底部日卡目标卡·汇总统计块底（周卡统计块底保持原版 rgba(250,140,22,.12)） */
.life-goal-card:not(.week-card) .lgc-stat{background:#e7f5ff}
/* ③ 底部周卡·汇总数字/进度数字/进度条 橙 */
.life-goal-card.week-card .lgc-num{color:#ff9e4f}
.life-goal-card.week-card .lgc-mp-num.week{color:#ff9e4f}
.life-goal-card.week-card .lgc-mp-fill.week{background:#ff9e4f}
/* ④ 弹窗热图里的进度数字（周卡）和外面保持一致 */
.life-modal-prog .lmp-num.week{color:#ff9e4f}
/* ⑤ 热图·日卡未完成（弹窗 + 底部小热图，不含 other-month） */
.life-modal-heatmap:not(.week) .life-heatmap .hm-day:not(.done):not(.other-month){background:#eef7ff}
.life-goal-card:not(.week-card) .life-heatmap .hm-day:not(.done):not(.other-month){background:#eef7ff}
/* ⑥ 热图·日卡选中当日(已打卡) */
.life-modal-heatmap:not(.week) .life-heatmap .hm-day.selected.done{background:#c6e4ff}
/* ⑦ 热图·周卡已打卡（底部小热图 + 弹窗 + 周视图） */
.life-goal-card.week-card .life-heatmap .hm-day.week{background:#ff9e4f}
.life-modal-heatmap.week .life-heatmap .hm-day.week{background:#ff9e4f}
.lwm-cell.week.done{background:#ff9e4f;border-color:#ff9e4f}
/* ===== /v627 每日打卡配色局部调整 ===== */

/* 本周概览（主页面大模块） */
.life-week-module{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow-sm);max-width:420px;margin:0 auto 14px}
.lwm-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;padding-left:0;padding-right:0}
.lwm-title{font-size:18px;font-weight:700;color:var(--c-text)}
.lwm-range{font-size:12px;font-weight:600;color:var(--c-text-light);min-width:120px;text-align:right}
.lwm-grid{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.lwm-row{display:grid;grid-template-columns:minmax(72px,1fr) repeat(7,minmax(0,30px));gap:3px;align-items:center;width:100%}
.lwm-row-hd .lwm-day{text-align:center;font-size:11px;color:var(--c-text-muted);font-weight:600}
.lwm-row-hd .lwm-habit{font-size:11px;color:var(--c-text-muted)}
.lwm-habit{font-size:14px;font-weight:600;color:var(--c-text);display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:0;text-align:left;padding-left:0;padding-right:8px;overflow:hidden}
.lwm-habit-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.lwm-habit .lwm-tag{font-size:9px;font-weight:400;color:var(--c-text-light);white-space:nowrap;flex-shrink:0;margin-left:5px}
.lwm-cell{width:100%;aspect-ratio:1/1;border-radius:3px;background:var(--c-bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;box-sizing:border-box;border:1px solid var(--c-border-light);cursor:pointer}
.lwm-cell.done{background:var(--c-primary);border-color:var(--c-primary)}
.lwm-cell.week{background:rgba(250,140,22,.16);border-color:rgba(250,140,22,.25)}
.lwm-cell.week.done{background:var(--c-orange);border-color:var(--c-orange)}
.lwm-cell.today{outline:1px solid var(--c-primary);outline-offset:-1px}
.lwm-cell.week.today{outline-color:var(--c-orange)}
.lwm-summary{display:flex;gap:10px;flex-wrap:wrap;margin:0 auto 12px;max-width:420px;background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow-sm)}
.lwm-sum-item{flex:1;min-width:100px;display:flex;flex-direction:column;gap:3px}
.lwm-sum-label{font-size:11px;color:var(--c-text-light)}
.lwm-sum-val{font-size:18px;font-weight:800;color:var(--c-text)}

/* Daily record */
.life-record-datebar{display:flex;align-items:center;gap:10px;background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:10px 14px;margin-bottom:4px;flex-wrap:wrap}
.life-record-datebar input[type=date]{padding:7px 9px;font-size:14px;border:1px solid var(--c-border);border-radius:var(--radius-sm);background:#fff;color-scheme:light}
.life-stat-row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.life-stat{flex:1;min-width:120px;background:var(--c-primary-bg);border-radius:var(--radius);padding:10px 14px;text-align:center}
.life-stat .ls-val{font-size:18px;font-weight:800;color:var(--c-primary-dark)}
.life-stat .ls-label{font-size:12px;color:var(--c-text-light);margin-top:2px}

.life-empty{color:var(--c-text-muted);font-size:13px;padding:12px 2px;text-align:center;background:var(--c-border-light);border-radius:var(--radius-sm);margin-bottom:8px}
.life-rec-item{background:var(--c-bg);border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;transition:border-color .2s}
.life-rec-item:hover{border-color:var(--c-primary)}
.life-rec-main{flex:1;min-width:0}
.life-rec-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--c-text)}
.life-rec-meta .lrf{display:flex;gap:4px}
.life-rec-meta .lrf b{color:var(--c-text-light);font-weight:500}
.life-rec-time{font-size:11px;color:var(--c-text-muted);margin-top:5px}
.life-rec-ops{display:flex;gap:4px;flex-shrink:0}
.life-rec-form{padding:0;background:transparent;border:none;display:block}
.life-rec-form .form-row{margin-bottom:14px}
.life-rec-form .form-row:last-child{margin-bottom:0}
.life-rec-form .form-label{font-size:13px;font-weight:500;color:var(--c-text)}
.life-rec-form .form-input,.life-rec-form .form-select{font-size:13px}
.life-rec-form .checkbox-group.pill-group,.life-rec-form .checkbox-group.tag-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}

.life-panel{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-top:14px;overflow:hidden}
.life-panel-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--c-primary-bg);border-bottom:1px solid var(--c-border-light)}
.life-panel-head .lph-ico{font-size:18px}
.life-panel-head .lph-label{font-weight:700;font-size:14px;color:var(--c-text)}
.life-panel-head .lph-count{font-size:11px;color:var(--c-text-light);background:#fff;border:1px solid var(--c-border);border-radius:10px;padding:1px 8px}
.life-panel-body{padding:12px 14px}

/* Sleep chart */
.sleep-chart{margin:2px 0 6px}
.sleep-chart-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.sleep-chart-title{font-size:12px;font-weight:600;color:var(--c-text-light)}
.sleep-chart-avg{font-size:12px;color:var(--c-primary-dark);font-weight:700}
.sleep-chart-bars{position:relative;display:flex;align-items:flex-end;gap:5px;height:120px;padding:0 2px}
.sleep-ref{position:absolute;left:2px;right:2px;border-top:1px dashed var(--c-warning);opacity:.7;z-index:1}
.sleep-bar-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.sleep-bar-val{font-size:9px;color:var(--c-text-light);margin-bottom:2px;white-space:nowrap;line-height:1}
.sleep-bar{width:100%;max-width:20px;background:linear-gradient(180deg,var(--c-primary),var(--c-primary-dark));border-radius:4px 4px 0 0;position:relative;z-index:2}
.sleep-bar.today{background:linear-gradient(180deg,var(--c-orange),#fa8c16)}
.sleep-bar.zero{background:repeating-linear-gradient(180deg,var(--c-border-light) 0 4px,transparent 4px 8px)}
.sleep-chart-x{display:flex;gap:5px;padding:4px 2px 0}
.sleep-x-col{flex:1;min-width:0;text-align:center;font-size:9px;color:var(--c-text-muted);white-space:nowrap;overflow:hidden}
.sleep-x-col.cur{color:var(--c-orange);font-weight:700}
.sleep-chart-foot{margin-top:6px;font-size:11px;color:var(--c-text-muted);display:flex;align-items:center;gap:5px}
.sleep-chart-foot .sch-dot{width:9px;height:9px;border-radius:2px;background:linear-gradient(180deg,var(--c-orange),#fa8c16)}

/* Sleep week table */
.life-week-table{margin-top:12px;background:var(--c-primary-bg);border-radius:var(--radius);padding:8px 10px}
.life-week-table .lwt-title{font-size:12px;font-weight:600;color:var(--c-text-light);margin-bottom:6px}
.life-week-table table{width:100%;border-collapse:collapse;font-size:12px}
.life-week-table th,.life-week-table td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--c-border-light)}
.life-week-table th{color:var(--c-text-light);font-weight:500}

/* ===== Daily Record v247: 1:1 screenshot layout ===== */
.life-record-page{background:var(--c-bg);border-radius:var(--radius);padding:0;margin:0}

/* Top overview card — v311: 左右两盒均分，中间竖线用左盒 border-right，底色白色 */
.lr-top-card{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;background:#FFFFFF;border:1px solid var(--c-border);border-radius:var(--radius);padding:0;margin-bottom:12px;box-shadow:var(--shadow-sm);overflow:hidden}
.lr-top-left{min-width:0;display:flex;align-items:flex-start;justify-content:flex-start;gap:14px;padding:16px 16px 16px 3px;border-right:1px solid var(--c-border-light);box-sizing:border-box}
.lr-ring-col{flex-shrink:0;display:flex;flex-direction:column;align-items:center;min-width:0;margin-left:-2px}
.sleep-ring-wrap{position:relative;width:160px;height:160px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sleep-ring{width:100%;height:100%;transform:rotate(-90deg)}
.sleep-ring-bg{fill:none;stroke:#DDEAF3;stroke-width:6}
.sleep-ring-fill{fill:none;stroke:var(--c-orange);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.sleep-ring-text{position:absolute;font-size:30px;font-weight:600;color:var(--c-text)}
.sleep-ring-text .dur-unit{font-size:16px}
.sleep-ring-status{margin-top:8px;font-size:12px;font-weight:600;color:var(--c-text);white-space:nowrap;text-align:center}
.lr-top-stats{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:14px}
.lr-top-stat{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.lts-label{font-size:11px;color:var(--c-text-light);white-space:nowrap}
.lts-val{font-size:26px;font-weight:700;color:var(--c-text);line-height:1.2;letter-spacing:0px}
.lts-val .dur-unit{font-size:18px}
.lts-val .lts-unit{font-size:28px;font-weight:600}
.lr-diet-btns{min-width:0;display:grid;grid-template-columns:repeat(2,1fr);gap:6px;align-content:center;justify-content:center;padding:16px 16px 16px 28px;width:100%;box-sizing:border-box;height:100%}
.lr-diet-qbtn{box-sizing:border-box;width:100%;border:1px solid #d6e6fb;border-radius:var(--radius-sm);background:#eef7ff;color:var(--c-text);font-size:22px;font-weight:700;padding:20px 8px;cursor:pointer;transition:.15s}
.lr-diet-qbtn:hover{background:#e0f2ff;border-color:var(--c-primary-light);color:var(--c-text)}
.lr-diet-qbtn.filled{background:rgba(24,144,255,.24);border-color:rgba(24,144,255,.24);color:var(--c-text)}
.lr-diet-qbtn.filled:hover{background:rgba(24,144,255,.24);border-color:rgba(24,144,255,.24);color:var(--c-text)}

/* Toggle buttons */
.lr-toggle-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.lr-date-nav{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:-4px;margin-bottom:8px}
.lr-date-nav .cd-month-label{font-size:14px;font-weight:700;color:var(--c-text);min-width:96px;text-align:center;cursor:pointer;user-select:none}
.lr-date-nav .cd-month-label:hover{color:var(--c-primary)}
.lr-date-nav .cd-month-btn{border:none;background:transparent;color:var(--c-text-light);font-size:14px;padding:4px 10px;box-shadow:none;cursor:pointer}
.lr-date-nav .cd-month-btn:hover{color:var(--c-primary);background:transparent}
.lr-date-nav .cd-month-btn:disabled{opacity:.35;cursor:not-allowed;color:var(--c-text-light);background:transparent}
.lmp-back{font-size:12px;color:var(--c-primary);text-align:center;padding:4px 0 8px;cursor:pointer}
.lr-toggle-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:0 12px;font-size:13px;font-weight:800;color:var(--c-text);cursor:pointer;transition:.15s;box-shadow:var(--shadow-sm);line-height:1;height:var(--pill-h);min-height:var(--pill-h)}
.lr-toggle-btn:hover{border-color:var(--c-primary);color:var(--c-primary)}
.lr-toggle-btn.active{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
.lr-toggle-btn span{font-size:18px}

/* Record cards */
.lr-card{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:12px;overflow:hidden}
.lr-card-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--c-primary-bg);border-bottom:1px solid var(--c-border-light)}
/* v687：标题改为 flex 容器，让图标与文字视觉中心对齐（消除 lucide-icon 基线偏上） */
/* v688：撤销 v687 的 flex（vertical-align:middle 已全局生效，不再需要 flex 居中） */
.lr-card-title{font-weight:700;font-size:14px;color:var(--c-text);flex:1}
.lr-card-body{padding:10px 12px}
.lr-subtype-box{display:flex;align-items:center;gap:10px;border:1px solid var(--c-border-light);border-radius:var(--radius-sm);background:#eef7ff;margin-bottom:10px;padding:10px 12px;position:relative}
.lr-subtype-box:last-child{margin-bottom:0}
.lr-subtype-label{flex-shrink:0;align-self:flex-start;width:44px;font-size:18px;font-weight:700;color:var(--c-text);line-height:1.2;text-align:center;margin-top:11px}
.lr-subtype-box:has(.lr-empty-row) .lr-subtype-label{align-self:flex-start;margin-top:8px}
.lr-subtype-content{flex:1;min-width:0}
.lr-subtype-add{flex-shrink:0;width:28px;height:28px;border-radius:var(--radius-sm);border:1px solid var(--c-primary);background:var(--c-primary);color:#fff;font-size:18px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:2px;align-self:flex-start}
.lr-subtype-add:hover{background:var(--c-primary-dark)}
.lr-head-add{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--c-primary);background:var(--c-primary);color:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;line-height:1}
.lr-head-add:hover{background:var(--c-primary-dark)}
.lr-head-add::before{content:'+';font-size:13px;font-weight:500;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.lr-empty-row{color:var(--c-text-muted);font-size:13px;padding:10px 0;cursor:pointer}
.lr-empty-row:hover{color:var(--c-primary)}
.lr-record-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dashed var(--c-border-light)}
.lr-record-row:last-child{border-bottom:none;padding-bottom:0}
.lr-record-row:first-child{padding-top:0}
.lr-record-info{flex:1;min-width:0}
.lr-record-info-2col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 40px}
.lr-record-info-2col .lr-info-val{overflow:visible;text-overflow:clip}
.lr-info-line{display:flex;align-items:baseline;gap:4px;min-width:0}
.lr-info-line-head{grid-column:1 / -1;display:flex;align-items:center;gap:6px}
.lr-info-line-head .lr-info-main{flex:1;min-width:0;display:flex;align-items:baseline;gap:4px}
.lr-info-line-head .lr-record-ops{margin-left:auto;flex-shrink:0}
.lr-info-label{font-size:12px;color:var(--c-text-light);font-weight:500;white-space:nowrap}
.lr-info-val{font-size:16px;color:var(--c-text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr-info-full{grid-column:1 / -1;white-space:normal;word-break:break-word}
.lr-info-full .lr-info-val{white-space:normal;overflow:visible;text-overflow:clip;word-break:break-word;font-size:13px}
.lr-record-ops{display:flex;gap:1px;flex-shrink:0;align-items:center}
.lr-record-ops .btn{padding:2px 7px;font-size:12px;line-height:1.2;border-radius:var(--radius-sm)}
.lr-size-note{font-size:11px;color:var(--c-text-light);white-space:normal;word-break:break-word;overflow-wrap:anywhere}
.lr-info-val .lr-size-note{font-weight:500}

/* Inline form tweaks */
.lf-field-full{width:100%;min-width:100%}
.life-rec-form .pill-group,.life-rec-form .tag-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.life-rec-form .pill-group .checkbox-item,.life-rec-form .tag-group .checkbox-item{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--c-border);background:#fff;color:var(--c-text);cursor:pointer;user-select:none;transition:all .2s}
.life-rec-form .pill-group .checkbox-item:hover,.life-rec-form .tag-group .checkbox-item:hover{border-color:var(--c-primary-light)}
.life-rec-form .pill-group .checkbox-item input,.life-rec-form .tag-group .checkbox-item input{margin:0;cursor:pointer}
.life-rec-form .pill-group .checkbox-item.selected,.life-rec-form .tag-group .checkbox-item.selected,.life-rec-form .pill-group .checkbox-item:has(input:checked),.life-rec-form .tag-group .checkbox-item:has(input:checked){background:var(--c-primary-bg);border-color:var(--c-primary);color:var(--c-primary);font-weight:500}
/* v641：小料份数步进器 */
.life-rec-form .tag-group .flavor-item{position:relative;max-width:100%;min-width:0}
.life-rec-form .flavor-qty{display:inline-flex;align-items:center;gap:3px;margin-left:5px}
.life-rec-form .fq-btn{width:18px;height:18px;display:flex;align-items:center;justify-content:center;border:1px solid var(--c-border);border-radius:4px;background:#fff;color:var(--c-text);font-size:13px;line-height:1;cursor:pointer;padding:0}
.life-rec-form .fq-btn:hover{border-color:var(--c-primary)}
.life-rec-form .fq-val{min-width:14px;text-align:center;font-size:12px}
/* v642：口味名过长截断省略，不自动换行 */
.life-rec-form .flavor-name{white-space:normal;word-break:break-word;overflow:visible;min-width:0;flex:1}

/* History view */
.lr-history-stat-card{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:10px;margin-bottom:8px;box-shadow:var(--shadow-sm)}
.lr-hsc-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-top:10px}
.lr-hsc-title{font-size:14px;font-weight:800;color:var(--c-text)}
.lr-hsc-sub{font-size:13px;font-weight:600;color:var(--c-text-light)}
.lr-hsc-avgs{display:flex;flex-wrap:wrap;justify-content:space-around;width:100%;gap:8px;margin:0}
.lr-hsc-avg{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--c-text-light);white-space:nowrap}
.lr-hsc-avg b{font-weight:700;margin-left:3px}
.lr-hsc-avg.night{color:#ff9a3c}
.lr-hsc-avg.nap{color:#FFDE75}
.lr-hsc-avg.wake{color:var(--c-text)}
.lr-hsc-chart-body{height:394px;position:relative;margin-top:16px}
.lr-hsc-chart-body svg{width:100%;height:100%;overflow:visible}
.lr-hsc-x{display:flex;justify-content:space-between;padding:8px 5.9% 0;font-size:12px;color:var(--c-text-light)}
.lr-hsc-point text{pointer-events:none}
.lr-hsc-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:8px 4px 4px;text-align:center}
.lr-hsc-metric{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.lr-hsc-metric-val{font-size:24px;font-weight:700;color:var(--c-text);line-height:1}
.lr-hsc-metric-val small{font-size:12px;font-weight:600;margin-left:2px;color:var(--c-text)}
.lr-hsc-metric-label{font-size:12px;color:var(--c-text-light);white-space:nowrap}
/* 睡眠周统计图：横版（日期列在左），橙色折线 */
.detail-products-list{display:flex;flex-direction:column;gap:8px}
.detail-product-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--c-border-light);border-radius:var(--radius-sm);background:var(--c-bg)}
.detail-product-item.prod-done{opacity:.75;background:var(--c-primary-bg)}
.detail-product-item .dpi-main{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px 12px}
.detail-product-item .dpi-seq{font-weight:700;color:var(--c-text-light);font-size:12px}
.detail-product-item .dpi-field{display:flex;flex-direction:column;gap:2px}
.detail-product-item .dpi-label{font-size:11px;color:var(--c-text-muted);white-space:nowrap}
.detail-product-item .dpi-val{font-size:13px;color:var(--c-text);word-break:break-word;line-height:1.4}
.detail-product-item .dpi-done{font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:4px;cursor:pointer;color:var(--c-text);user-select:none}
/* 睡眠周统计图：横版（日期列在左），橙色进度条 */
.lr-hsc-hbar-list{display:flex;flex-direction:column;gap:9px;padding:6px 4px 8px}
.lr-hsc-hbar-row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px}
.lr-hsc-hbar-label{font-size:12px;color:var(--c-text-light);text-align:left;white-space:nowrap}
.lr-hsc-hbar-track{position:relative;height:16px;background:var(--c-primary-bg);border-radius:8px;overflow:hidden}
.lr-hsc-hbar-fill{height:100%;background:linear-gradient(90deg,#ffb454,var(--c-orange));border-radius:8px;transition:width .4s ease}
.lr-hsc-hbar-val{font-size:13px;font-weight:600;color:var(--c-text);white-space:nowrap}
.lr-hsc-bar-body{display:flex;align-items:flex-end;justify-content:space-around;gap:8px;height:90px}
.lr-hsc-bar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.lr-hsc-bar{width:20px;max-width:80%;background:linear-gradient(180deg,var(--c-primary),var(--c-primary-dark));border-radius:4px 4px 0 0;min-height:4px}
.lr-hsc-bar-num{font-size:13px;font-weight:800;color:var(--c-text)}
.lr-hsc-bar-label{font-size:11px;color:var(--c-text-light);white-space:nowrap}
.lr-hsc-diet-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 12px;padding:4px 2px}
.lr-hsc-diet-item{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--c-text)}
.lr-hsc-diet-count{font-weight:700;color:var(--c-primary)}
.lr-history-day-card{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:12px;overflow:hidden}
.lr-history-day-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--c-primary-bg);border-bottom:1px solid var(--c-border-light)}
.lr-history-day-date{font-size:14px;font-weight:700;color:var(--c-text)}
.lr-history-day-wd{font-size:12px;color:var(--c-text-light);font-weight:500}
.lr-history-day-extra{margin-left:auto;font-size:13px;font-weight:700;color:var(--c-primary-dark)}
.lr-history-day-body{padding:10px 12px}
.lr-week-nav{position:relative;z-index:60;display:flex;align-items:center;justify-content:center;gap:2px;margin-top:-4px;margin-bottom:8px}
.lr-week-nav .btn{border:none;background:transparent;color:var(--c-text-light);font-size:14px;padding:4px 8px;box-shadow:none}
.lr-week-nav .btn:hover{color:var(--c-primary);background:transparent}
.lr-week-nav .btn:disabled{opacity:.35;cursor:not-allowed;color:var(--c-text-light);background:transparent}
.lr-week-nav .life-monthbar-txt{font-size:14px;font-weight:700;color:var(--c-text);min-width:120px;text-align:center;cursor:pointer;user-select:none}
.lr-week-nav .life-monthbar-txt:hover{color:var(--c-primary)}

@media (max-width:640px){
  .life-goal-grid{grid-template-columns:1fr}
  .life-year-grid{grid-template-columns:1fr}
  .cd-rec-list{column-count:1}
  .life-goal-card{padding:12px}
  .lgc-body{flex-wrap:nowrap;align-items:center}
  .lgc-heatmap{width:74px;flex-shrink:0}
  .field-edit-row label{width:55px}
  .field-edit-row input{min-width:0}
  .option-edit-item input{min-width:0}
  .life-qm-table{font-size:12px}
  .life-qm-table th,.life-qm-table td{padding:8px 4px}
  .life-summary-row{grid-template-columns:repeat(2,1fr)}
  .life-hero .lh-ico{font-size:26px}
  .life-record-page{padding:0;margin:0}
  .life-quick-checkin{padding:14px 12px}
  .lr-top-card{padding:10px}
  .lr-top-left{gap:6px;padding:10px 10px 10px 1px;border-right:1px solid var(--c-border-light)}
  .sleep-ring-wrap{width:100px;height:100px}
  .sleep-ring-text{font-size:22px}
  .sleep-ring-text .dur-unit{font-size:14px}
  .sleep-ring-status{font-size:10px;margin-top:5px}
  .lr-top-stats{gap:8px}
  .lr-top-stat{gap:0}
  .lts-label{font-size:9px}
  .lts-val{font-size:18px}
  .lts-val .dur-unit{font-size:16px}
  .lts-val .lts-unit{font-size:22px;font-weight:600}
  .lr-diet-btns{gap:5px;padding:10px 10px 10px 18px}
  .lr-diet-qbtn{font-size:18px;font-weight:700;padding:14px 6px;border-radius:var(--radius-sm)}
  .lqc-grid{gap:6px;grid-template-columns:repeat(auto-fit,minmax(64px,1fr))}
  .lqc-btn{font-size:18px;font-weight:550;background:var(--c-bg);color:var(--c-text);padding:12px 4px}
  .lqc-label{font-size:18px;font-weight:550;white-space:nowrap}
  .lr-toggle-btn{font-size:13px;padding:0 12px}
  .lr-card-head{padding:8px 10px}
  .lr-card-title{font-size:14px}
  .lr-card-body{padding:8px 10px}
  .lr-subtype-box{align-items:center;gap:8px;padding:8px 10px}
  .lr-subtype-label{width:36px;font-size:16px;margin-top:10px}
  .lr-subtype-box:has(.lr-empty-row) .lr-subtype-label{align-self:flex-start;margin-top:8px}
  .lr-subtype-add{width:24px;height:24px;font-size:16px}
  .lr-record-info-2col{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 22px}
  .lr-info-label{font-size:11px}
  .lr-info-val{font-size:14px}
  .lr-info-full .lr-info-val{font-size:12px}
  .lr-record-ops .btn{padding:1px 6px;font-size:11px}
  .lr-size-note{font-size:10px}
  .lr-history-stat-card{padding:8px}
  .lr-hsc-title{font-size:14px}
  .lr-hsc-chart-body{height:324px;margin-top:10px}
  .lr-hsc-metrics{gap:6px;padding:6px 2px 2px}
  .lr-hsc-metric-val{font-size:18px}
  .lr-hsc-metric-val small{font-size:11px}
  .lr-hsc-metric-label{font-size:11px}
  .lr-hsc-hbar-label{font-size:11px}
  .lr-hsc-hbar-val{font-size:12px}
  .lr-hsc-hbar-row{grid-template-columns:36px 1fr auto;gap:8px}
  .lr-hsc-x{font-size:11px}
  .lr-hsc-diet-grid{gap:6px 10px}
  .lr-hsc-diet-item{font-size:12px}
}

/* ===== 接稿详情（大板块 + 标签页 + 导入渠道） ===== */
.commission-detail-page{margin-top:4px}
.cd-page-head{font-size:18px;font-weight:700;color:var(--c-primary-dark);margin:2px 0 12px}
/* 信息录入：三个按钮并列 */
.cd-import-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.cd-import-btn{padding:14px 12px;border:1px solid var(--c-border-light);border-radius:12px;background:#fff;cursor:pointer;transition:.15s;text-align:center;margin-bottom:-2px}
.cd-import-btn:hover{border-color:var(--c-primary);box-shadow:0 2px 10px rgba(0,0,0,.06);transform:translateY(-2px)}
.cd-import-btn-icon{font-size:26px;margin-bottom:3px}
/* v452：顶部导入渠道按钮字色与接稿详情四个品类按钮内文字色(var(--c-text))统一 */
.cd-import-btn-name{font-size:14px;font-weight:700;color:var(--c-primary-dark)}
.cd-import-btn-desc{font-size:12px;color:var(--c-text-muted);margin-top:1px}
/* 品类切换按钮（四个并排均分，与首页平台按钮同款均分布局） */
.cd-cat-bar{display:flex;gap:8px;margin-bottom:8px}
.cd-cat-btn{flex:1;justify-content:center;padding:11px 6px;border:1px solid var(--c-border-light);border-radius:12px;font-size:14px;cursor:pointer;background:#fff;color:var(--c-text);transition:.15s;display:flex;align-items:center;gap:6px;font-weight:700;margin-bottom:-2px}
.cd-cat-btn:hover{border-color:var(--c-primary);color:var(--c-primary)}
.cd-cat-btn.active{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
/* v452：品类按钮后数字颜色与按钮内文字色(var(--c-text))一致；激活态保持 #fff */
.cd-cat-count{font-size:11px;color:var(--c-text);font-weight:700}
.cd-cat-btn.active .cd-cat-count{color:#fff}
/* 月导航（像每日打卡日期按钮：无边框、透明底、浅色字、hover 变主色） */
.cd-month-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0 6px;position:relative;padding:0 70px}
/* v638：未关联按钮样式参考每日打卡周/月/年按钮(.lbt-btn)，宽度自适配 */
.cd-unlinked-btn{position:absolute;right:0;top:50%;transform:translateY(-50%);border:1px solid var(--c-border);background:var(--c-card);color:var(--c-text-light);font-size:12px;font-weight:600;padding:5px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;white-space:nowrap}
.cd-unlinked-btn:hover{border-color:var(--c-primary)}

<script>
  (function(){
    if(window.parent===window) return;
    var q=location.search||'';
    if(q.indexOf('preview=1')===-1) return;
    function post(t,msg){
      try{ window.parent.postMessage({type:t,msg:msg},'*'); }catch(e){}
    }
    window.addEventListener('error',function(e){
      post('preview-error',(e.message||'error')+' @ '+(e.filename||'')+':'+(e.lineno||0));
    });
    window.addEventListener('unhandledrejection',function(e){
      post('preview-error','Unhandled rejection: '+(e.reason&&e.reason.message?e.reason.message:String(e.reason)));
    });
    var orig=console.log;
    console.log=function(){
      post('preview-log',Array.from(arguments).map(String).join(' '));
      return orig.apply(console,arguments);
    };
    if(document.readyState==='loading'){
      document.addEventListener('DOMContentLoaded',function(){post('preview-ready','dom ready');});
    }else{
      post('preview-ready','dom ready');
    }
  })();
</script>
